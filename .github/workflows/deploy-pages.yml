# GitHub Pages 배포.
#
# **push로는 아무 일도 일어나지 않는다.** Actions 탭에서 직접 실행할 때에만
# 사이트가 갱신된다.
#
# 사이트는 `npm run build`(Vite + Tailwind)로 dist/에 만들어 올린다.
# 저장소 뿌리를 그대로 올리던 때와 달리 페이지의 CSS가 빌드 결과물에만 있으므로
# 빌드를 건너뛰고 올리면 스타일이 빠진 사이트가 된다.
#
# 저장소 설정이 Settings → Pages → Source: GitHub Actions 여야 한다.
# 'Deploy from a branch'로 되돌리면 push마다 자동 배포가 되살아나고,
# 빌드하지 않은 저장소 뿌리가 그대로 올라간다.

name: Deploy to GitHub Pages

on:
  workflow_dispatch:

# 배포가 겹치지 않게 한 번에 하나만 돌린다.
# 진행 중인 배포를 취소하지 않는다 - 중간에 끊으면 사이트가 반쯤 갱신된 채 남는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
