name: Auto Zip and Release All Folders

on:
  push:
    branches:
      - master # Triggers when code is pushed to the master branch

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required permission to create and update releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Zip Each Folder Individually
        run: |
          # Iterate over all directories in the root
          for dir in */; do
            # Remove trailing slash to get the exact folder name (e.g., "A/" becomes "A")
            dir_name="${dir%/}"
          
            # Skip hidden folders like .git, .github, etc.
            if [[ "$dir_name" == .* ]]; then
              continue
            fi
          
            echo "Zipping folder: $dir_name -> $dir_name.zip"
          
            # Navigate into the directory, zip its contents, and save to the parent directory
            cd "$dir_name"
            zip -r "../${dir_name}.zip" .
            cd ..
          done

      - name: Upload Zips to Latest Release
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"                  # Keep the tag as "latest"
          name: "Latest Web Apps Release" # The display name of the release
          artifacts: "*.zip"             # Upload all generated zip files
          allowUpdates: true             # Allow updating the existing "latest" release
          replacesArtifacts: true        # Replace old zip files with the newly created ones
          token: ${{ secrets.GITHUB_TOKEN }}
