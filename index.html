<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Utility Kit | luminousky.com</title>

    <link rel="stylesheet" href="./tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
                    },
                    letterSpacing: {
                        tighter: '-0.04em',
                        tight: '-0.02em',
                    }
                }
            }
        }
    </script>

    <style>
        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");

        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            letter-spacing: -0.01em;
        }

        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- Ambient Gradient Blobs for Hero --- */
        @keyframes ambient-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(5%, 5%) scale(1.05);
            }
            66% {
                transform: translate(-5%, 2%) scale(0.95);
            }
            100% {
                transform: translate(0, 0) scale(1);
            }
        }

        .hero-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.6;
            animation: ambient-drift 15s infinite ease-in-out alternate;
        }

        /* 블러가 화면에 꽉 차게 퍼지도록 크기와 위치를 조정했습니다 */
        .blob-1 {
            top: -20%;
            left: 0%;
            width: 50vw;
            height: 50vw;
            background: #c896ff;
        }

        .blob-2 {
            top: -10%;
            right: 0%;
            width: 40vw;
            height: 40vw;
            background: #7ca6f2;
            animation-delay: -5s;
        }

        .blob-3 {
            bottom: -10%;
            left: 10%;
            width: 60vw;
            height: 60vw;
            background: #ffbfa1;
            animation-delay: -10s;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-700 selection:bg-slate-700 selection:text-white min-h-screen flex flex-col">

<header class="relative min-h-[450px] flex flex-col items-center justify-center px-4 text-center reveal overflow-hidden bg-slate-50">
    <div class="absolute inset-0 w-full h-full pointer-events-none z-0">
        <div class="hero-blob blob-1"></div>
        <div class="hero-blob blob-2"></div>
        <div class="hero-blob blob-3"></div>
        <div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-slate-50 to-transparent"></div>
    </div>

    <div class="max-w-6xl mx-auto relative z-10 w-full">
        <h1 class="text-5xl md:text-7xl font-semibold tracking-tighter mb-4 text-slate-800">
            Teacher Utility Kit
        </h1>
        <p class="text-2xl md:text-3xl text-slate-500 font-medium max-w-2xl mx-auto tracking-tight">
            수업과 업무 효율을 높여주는 교육용 도구 모음입니다.
        </p>
    </div>
</header>

<main class="flex-grow px-4 pb-24 pt-12">
    <div class="max-w-6xl mx-auto">
        <div id="tools-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 gap-4">
        </div>

        <div id="empty-state" class="hidden text-center py-20 reveal">
            <i class="fa-solid fa-box-open text-5xl text-slate-300 mb-4"></i>
            <p class="text-lg text-slate-400 font-medium">현재 등록된 도구가 없습니다.</p>
        </div>
    </div>
</main>

<footer class="py-8 border-t border-slate-200 bg-white">
    <div class="max-w-6xl mx-auto px-4 text-center">
        <p class="text-base font-medium text-slate-400 tracking-tight">
            &copy; 2026 luminousky.com. All rights reserved.
        </p>
    </div>
</footer>

<script>
    const tools = [
        {
            name: "정보·컴퓨터 교과 강의 자료",
            description: "프로그래밍과 컴퓨터 과학 개념을 수업에서 직관적으로 설명할 수 있도록 개발된 시각화 강의 자료입니다. 별도의 설치 없이 브라우저에서 바로 접속하여 사용할 수 있습니다.",
            url: "https://luminousky.com/Visual-Assets-for-CS-Teacher",
            icon: "chalkboard-user"
        },
        {
            name: "모의고사 성적 분석 시스템",
            description: "복잡한 성적 데이터를 한눈에 파악할 수 있도록 시각화합니다. 학교별 맞춤형 성적 분석 리포트를 자동 생성합니다. 다양한 진학 프로그램의 엑셀 파일으로 내보내기도 가능합니다.",
            url: "/teacher-utility-kit/score-reporter/",
            icon: "chart-bar"
        },
        {
            name: "진학 상담 프로그램 자동 재시작 배치파일",
            description: "대교협 상담 프로그램 서버 장애 대비용 자동 재시작 배치파일입니다. 대교협 서버 강제 종료 시 자동으로 복구하여 진학 상담 흐름을 유지합니다.",
            url: "/teacher-utility-kit/auto-restart-daegyohyeop/",
            icon: "terminal"
        },
        {
            name: "QRCode 등록 시스템",
            description: "다수의 QRCode를 연속 스캔하여 엑셀 파일로 즉시 저장합니다. 태블릿 시리얼 번호 등록 등 대량 QRCode 스캔에 최적화되어 있습니다.",
            url: "/teacher-utility-kit/register-qrcode/",
            icon: "qrcode"
        },
        {
            name: "코드 학습지 생성기",
            description: "프로그래밍 수업용 코드 학습지 제작 도구입니다. 교사가 다양한 프로그래밍 코드 학습지를 손쉽게 제작하고 PDF로 다운받을 수 있도록 도와줍니다.",
            url: "/teacher-utility-kit/code-sheet-builder/",
            icon: "file-code"
        },
        {
            name: "학교생활기록부 일괄 점검 프로그램",
            description: "효율적인 학교생활기록부 점검을 위한 PDF/엑셀 키워드 자동 강조 및 북마크 생성 도구입니다.",
            url: "/teacher-utility-kit/neis-wordfinder/",
            icon: "magnifying-glass"
        },
        {
            name: "Google Forms to PDF 변환기",
            description: "구글 폼 설문 응답 CSV를 맞춤형 템플릿의 PDF로 자동 변환하는 도구입니다.",
            url: "https://github.com/itmir913/google-forms-to-pdf-gui",
            icon: "file-pdf"
        },
    ];

    function createCard(tool, index) {
        const delay = index * 100;
        return `
                <a href="${tool.url}"
                   class="block bg-white rounded-2xl border border-slate-200 shadow-sm p-6
                          hover:shadow-lg hover:-translate-y-1 hover:border-indigo-300
                          transition-all duration-300 ease-in-out group reveal"
                   style="transition-delay: ${delay}ms"
                   target="${tool.url.startsWith('http') ? '_blank' : '_self'}"
                   rel="${tool.url.startsWith('http') ? 'noopener noreferrer' : ''}">
                    <div class="flex items-start space-x-4">
                        <div class="flex-shrink-0 w-12 h-12 flex items-center justify-center rounded-xl bg-slate-50 group-hover:bg-indigo-50 transition-colors duration-300">
                            <i class="fa-solid fa-${tool.icon} text-xl text-slate-700 group-hover:text-indigo-600 transition-colors"></i>
                        </div>
                        <div class="flex-1 pt-1">
                            <h2 class="text-lg font-semibold text-slate-800 mb-1 group-hover:text-indigo-700 transition-colors">
                                ${tool.name}
                            </h2>
                            <p class="text-base text-slate-500 leading-relaxed">
                                ${tool.description}
                            </p>
                        </div>
                    </div>
                </a>
            `;
    }

    function renderCards() {
        const grid = document.getElementById('tools-grid');
        const emptyState = document.getElementById('empty-state');

        if (!tools || tools.length === 0) {
            grid.classList.add('hidden');
            emptyState.classList.remove('hidden');
            return;
        }

        grid.innerHTML = tools.map((tool, index) => createCard(tool, index)).join('');
    }

    function initReveals() {
        const reveals = document.querySelectorAll('.reveal');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, {
            threshold: 0.1,
            rootMargin: "0px 0px -20px 0px"
        });

        reveals.forEach(reveal => observer.observe(reveal));
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderCards();

        setTimeout(() => {
            initReveals();
            const initialReveals = document.querySelectorAll('header.reveal');
            initialReveals.forEach(el => el.classList.add('active'));
        }, 50);
    });
</script>
</body>
</html>
