<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Utility Kit | luminousky.com</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");

        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        @keyframes ambient-drift {
            0%   { transform: translate(0, 0) scale(1); }
            33%  { transform: translate(5%, 5%) scale(1.05); }
            66%  { transform: translate(-5%, 2%) scale(0.95); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .hero-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.55;
            animation: ambient-drift 15s infinite ease-in-out alternate;
        }
        .blob-1 { top: -20%; left: 0;     width: 50vw; height: 50vw; background: #c896ff; }
        .blob-2 { top: -10%; right: 0;    width: 40vw; height: 40vw; background: #7ca6f2; animation-delay: -5s; }
        .blob-3 { bottom: -10%; left: 10%; width: 60vw; height: 60vw; background: #ffbfa1; animation-delay: -10s; }

        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .nav-pill.active {
            background: #1d1d1f !important;
            color: #ffffff !important;
            border-color: #1d1d1f !important;
        }
        .nav-pill.active:hover {
            background: #333 !important;
            border-color: #333 !important;
        }
    </style>
</head>
<body class="bg-[#fbfbfd] text-[#1d1d1f] tracking-tight min-h-screen flex flex-col">

    <div class="absolute inset-0 pointer-events-none z-0">
        <div class="hero-blob blob-1"></div>
        <div class="hero-blob blob-2"></div>
        <div class="hero-blob blob-3"></div>
        <div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-[#fbfbfd] to-transparent"></div>
    </div>

    <div class="relative z-10 max-w-5xl mx-auto w-full">
        <h1 class="text-5xl sm:text-6xl md:text-7xl font-bold tracking-tighter leading-none mb-6 text-[#1d1d1f]">
            Teacher Utility Kit
        </h1>

            수업과 업무를 위한 도구 모음
        </p>
    </div>
</header>

<!-- ░░ MAIN ░░ -->
<main class="flex-grow px-6 pb-16 md:pb-32 pt-6">
    <div class="max-w-7xl mx-auto">

        <nav id="category-nav" class="flex flex-wrap justify-center gap-2 mb-8 md:mb-16 sticky top-4 z-50 reveal"></nav>

        <div id="categories-container"></div>

        <div id="empty-state" class="hidden text-center py-24 reveal">
            <p class="text-lg font-medium text-[#86868b]">현재 등록된 도구가 없습니다.</p>
        </div>

    </div>
</main>

<!-- ░░ LICENSE ░░ -->
<section class="py-20 bg-[#f5f5f7] border-t border-black/[0.08] reveal">
    <div class="max-w-7xl mx-auto px-6">

        <p class="text-base font-semibold tracking-widest uppercase text-[#86868b] mb-3">License</p>
        <h2 class="text-3xl font-bold tracking-tight text-[#1d1d1f] mb-6">라이선스</h2>
        <p class="text-lg leading-relaxed text-[#86868b] mb-10">
            이 레포지토리의 모든 소스코드는 별도 라이선스 파일이 명시되지 않은 한
            <strong class="font-semibold text-[#1d1d1f]">PolyForm Noncommercial License 1.0.0</strong>을 따릅니다.
        </p>

        <div class="flex flex-col divide-y divide-black/[0.08]">
            <div class="flex items-baseline gap-6 py-5">

                <p class="text-base leading-relaxed text-[#86868b]">
                    개인 용도, 학교 등 교육기관에서의 비영리 목적의 사용 및 배포
                </p>
            </div>
            <div class="flex items-baseline gap-6 py-5">
                <span class="shrink-0 text-base font-semibold text-[#ff3b30] w-10">금지</span>
                <p class="text-base leading-relaxed text-[#86868b]">
                    판매, 유료 서비스 제공, 기업 내 이익 창출 등 모든 상업적 영리 활동
                </p>
            </div>
        </div>

    </div>
</section>

<script>
    const categories = [
        {
            title: "정보 교과 수업용",

            cols: 2,
            tools: [
                {
                    name: "정보·컴퓨터 교과 강의 자료",
                    description: "프로그래밍과 컴퓨터 과학 개념을 수업에서 직관적으로 설명할 수 있도록 개발된 시각화 강의 자료입니다.",
                    url: "https://luminousky.com/Visual-Assets-for-CS-Teacher/",
                    icon: "chalkboard-user"
                },
                {
                    name: "코드 학습지 생성기",

                },
                {

                    description: "교내 프로그래밍 대회나 코딩 테스트를 위한 자체 자동 채점 서버(DOMjudge) 구축 가이드입니다. 서버 설치부터 운영 설정까지 단계별로 상세히 안내합니다.",
                    url: "/teacher-utility-kit/domjudge-guide/",
                    icon: "server"
                },
                {
                    name: "머신러닝 Playgrounds",
                    description: "브라우저에서 CSV 데이터와 이미지를 직접 학습시키고, 예측·분류·군집 결과를 즉시 확인할 수 있는 머신러닝 실습 도구입니다.",
                    url: "/teacher-utility-kit/ml-playgrounds/",
                    icon: "brain",
                    disabled: true
                }
            ]
        },
        {
            title: "학교 업무 자동화",
            mobileTitle: "업무 자동화",
            cols: 3,
            tools: [
                {
                    name: "All-in-One 학교생활기록부 에디터",
                    description: "학생 등록부터 영역 구성, 활동 생성, 생기부 작성, 나이스(NEIS) 내보내기까지 전 과정을 지원하는 에디터입니다. 실시간 바이트 계산과 자동 저장 기능으로 안전하고 편리하게 생기부를 완성할 수 있습니다.",
                    url: "/teacher-utility-kit/neis-editor/",
                    icon: "pen-nib"
                },
                {
                    name: "학교생활기록부 일괄 점검 프로그램",
                    description: "다수의 학생부 Excel/PDF 파일을 한 번에 분석하여 키워드 강조 및 북마크를 자동 생성하는 효율적인 생기부 점검 지원 도구입니다.",
                    url: "/teacher-utility-kit/neis-wordfinder/",
                    icon: "file-shield"
                },
                {
                    name: "학교장 추천자 선발 관리 시스템",
                    description: "학교장추천전형 지원자의 점수 계산·순위·추천 확정을 내부망 단일 exe로 관리합니다. 관리자와 담임교사가 역할을 나눠 진행하는 LAN 전용 웹 애플리케이션입니다.",
                    url: "/teacher-utility-kit/principal-candidate-manager",
                    icon: "ranking-star"
                },
                {
                    name: "모의고사 성적 분석 시스템",
                    description: "모의고사 데이터를 시각화하여 분석하고 리포트를 자동 생성합니다. 서로 다른 진학 프로그램의 엑셀 파일로 변환하는 기능을 지원합니다.",
                    url: "/teacher-utility-kit/score-reporter/",
                    icon: "chart-column"
                },
                {
                    name: "진학 상담 프로그램 자동 재시작 배치파일",
                    description: "대교협 상담 프로그램 서버 장애 대비용 자동 재시작 배치파일입니다. 대교협 서버 강제 종료 시 자동으로 복구하여 진학 상담 흐름을 유지합니다.",
                    url: "/teacher-utility-kit/auto-restart-daegyohyeop/",
                    icon: "terminal"
                },
                {
                    name: "구글 드라이브 통합검색 시스템",
                    description: "업무 매뉴얼이나 대입 자료 등 구글 드라이브에 저장된 문서의 파일명과 내용 전체를 키워드로 빠르게 검색할 수 있는 웹앱 구축 가이드입니다.",
                    url: "/teacher-utility-kit/gdrive-indexr/",
                    icon: "search"
                }
            ]
        },
        {
            title: "기타 유틸리티",
            mobileTitle: "기타",
            cols: 4,
            tools: [
                {
                    name: "프롬프트 갤러리",
                    description: "생기부 문장 작성, 루브릭 생성 등 교육 현장에 맞춰 제작된 AI 프롬프트 모음입니다. 복사 한 번으로 바로 활용하세요.",
                    url: "/teacher-utility-kit/prompt-gallery/",
                    icon: "wand-magic-sparkles"
                },
                {
                    name: "교사를 위한 유틸리티 프로그램",
                    description: "반복되는 학교 업무를 자동화하고, 수업과 학생 관리에 집중할 수 있도록 지원하는 필수 교사용 프로그램과 유틸리티 모음입니다.",
                    url: "/teacher-utility-kit/teacher-tools/",
                    icon: "toolbox"
                },
                {
                    name: "선생님 실시간 호출 시스템",
                    description: "교무실에 계신 선생님께 용무가 있을 때, 교무실 문 밖에서 선생님에게 실시간으로 호출 신호를 보내는 호출벨 시스템입니다.",
                    url: "/teacher-utility-kit/school-call/",
                    icon: "bell"
                },
                {
                    name: "QRCode 등록 시스템",
                    description: "다수의 QRCode를 연속 스캔하여 엑셀 파일로 즉시 저장합니다. 태블릿 시리얼 번호 등록 등 대량 QRCode 스캔에 최적화되어 있습니다.",
                    url: "/teacher-utility-kit/register-qrcode/",
                    icon: "qrcode"
                }
            ]
        }
    ];

    function createCard(tool, index) {
        const isExternal = tool.url.startsWith('http');
        const isDisabled = tool.disabled === true;

        if (isDisabled) {
            return `
            <div class="block bg-white/60 border border-black/[0.06] rounded-2xl p-8
                        opacity-50 cursor-default reveal"
                 style="transition-delay:${index * 60}ms">
                <div class="flex items-start justify-between mb-5">
                    <i class="fa-solid fa-${tool.icon} text-2xl text-[#86868b]"></i>
                    <span class="text-xs font-semibold text-[#86868b] bg-[#f5f5f7] rounded-full px-3 py-1 mt-0.5">개발 중</span>
                </div>
                <h2 class="text-xl font-semibold text-[#1d1d1f] mb-3 leading-snug break-keep">
                    ${tool.name}
                </h2>
                <p class="text-base text-[#86868b] leading-relaxed">
                    ${tool.description}
                </p>
            </div>`;
        }

        return `
        <a href="${tool.url}"
           class="group block bg-white border border-black/[0.08] rounded-2xl p-8 no-underline
                  hover:bg-[#f5f5f7] hover:border-black/[0.12]
                  transition-colors duration-300 reveal"
           style="transition-delay:${index * 60}ms"
           ${isExternal ? 'target="_blank" rel="noopener noreferrer"' : ''}>
            <div class="flex items-start justify-between mb-5">
                <i class="fa-solid fa-${tool.icon} text-2xl text-[#86868b] group-hover:text-[#1d1d1f] transition-colors duration-300"></i>
                <i class="fa-solid fa-arrow-right text-base text-[#86868b] mt-1
                          opacity-0 -translate-x-1
                          group-hover:opacity-100 group-hover:translate-x-0
                          transition-all duration-200"></i>
            </div>
            <h2 class="text-xl font-semibold text-[#1d1d1f] mb-3 leading-snug break-keep">
                ${tool.name}
            </h2>
            <p class="text-base text-[#86868b] leading-relaxed">
                ${tool.description}
            </p>
        </a>`;
    }

    function renderNavigation() {
        const nav = document.getElementById('category-nav');
        if (!categories.length) return;

        nav.innerHTML = categories.map((cat, i) => `
            <a href="#category-${i}"
               class="nav-pill inline-flex items-center px-5 py-2.5 rounded-full
                      border border-black/[0.12] bg-white/80 backdrop-blur-md
                      text-base font-semibold text-[#1d1d1f] no-underline whitespace-nowrap
                      hover:text-[#0066cc] hover:border-[#0066cc]/40 hover:bg-white hover:-translate-y-px
                      transition-all duration-200">
                <span class="inline sm:hidden">${cat.mobileTitle || cat.title}</span>
                <span class="hidden sm:inline">${cat.title}</span>
            </a>`
        ).join('');
    }

    function renderCategories() {
        const container = document.getElementById('categories-container');
        const empty = document.getElementById('empty-state');

        if (!categories.length) {
            container.classList.add('hidden');
            empty.classList.remove('hidden');
            return;
        }

        container.innerHTML = categories.map((cat, catIdx) => {
            if (!cat.tools?.length) return '';
            const cards = cat.tools.map((tool, i) => createCard(tool, i)).join('');
            const divider = catIdx > 0 ? 'pt-14 mt-14 border-t border-black/[0.08]' : '';
            const colsMap = { 2: 'sm:grid-cols-2', 3: 'sm:grid-cols-2 lg:grid-cols-3', 4: 'sm:grid-cols-2 lg:grid-cols-4' };
            const colsClass = colsMap[cat.cols] || 'sm:grid-cols-2 lg:grid-cols-3';
            return `
            <section id="category-${catIdx}" class="category-section scroll-mt-24 ${divider}">
                <h2 class="text-base font-semibold tracking-wider uppercase text-[#86868b] mb-6 reveal">
                    ${cat.title}
                </h2>
                <div class="grid grid-cols-1 ${colsClass} gap-4">
                    ${cards}
                </div>
            </section>`;
        }).join('');
    }

    function initReveals() {
        const observer = new IntersectionObserver(entries => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); });
        }, { threshold: 0.08, rootMargin: '0px 0px -20px 0px' });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    }

    function initNavHighlight() {
        const pills = document.querySelectorAll('#category-nav .nav-pill');
        const sections = document.querySelectorAll('.category-section');

        function update() {
            const threshold = window.innerHeight * 0.35;
            let activeId = null;
            sections.forEach(s => {
                if (s.getBoundingClientRect().top <= threshold) activeId = s.id;
            });
            pills.forEach(p => p.classList.toggle('active', p.getAttribute('href') === `#${activeId}`));
        }

        window.addEventListener('scroll', update, { passive: true });
        update();
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderNavigation();
        renderCategories();

        setTimeout(() => {
            initReveals();
            initNavHighlight();
            document.querySelectorAll('header.reveal').forEach(el => el.classList.add('active'));
        }, 50);
    });
</script>
</body>
</html>
