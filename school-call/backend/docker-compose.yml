name: school-call-server

# ────────────────────────────────────────────────────────
# MODE 설정
#
# [relay]  클라이언트 간 이벤트를 중계하는 기본 서버.
#          로컬 단독 운영 또는 Cloud VPS 배포 시 사용.
#  docker compose --env-file .env.relay up -d --build
#
# [mirror] relay로 동작하면서, 외부 relay 서버(Cloud VPS)에
#          동일 신호를 복제 전송. 내부망과 외부망을 동시에
#          지원해야 할 때 사용 (라즈베리파이 배포 시).
#  docker compose --env-file .env.mirror --profile mirror up -d --build
# ────────────────────────────────────────────────────────

services:
  # ── Node.js 백엔드 ──────────────────────────────────────────
  school-call:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school-call-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MODE=${MODE}
      - NODE_OPTIONS=${NODE_OPTIONS}
      - CLOUD_URL=${CLOUD_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    sysctls:
      net.core.somaxconn: 65535
      net.ipv4.tcp_max_syn_backlog: 65535
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.tcp_fin_timeout: 15
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── Nginx 웹 서버 & 리버스 프록시 ───────────────────────────
  # mirror 모드에서만 기동됩니다. (핫스팟 내 정적 파일 서빙 용도)
  nginx:
    profiles: [ mirror ]
    image: nginx:alpine
    container_name: school-call-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://school-call:3000
    volumes:
      - ../:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - school-call
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
