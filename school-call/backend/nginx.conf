server {
    listen 80;
    server_name _; # 라즈베리파이의 IP와 상관없이 모든 요청 수락

    # 정적 파일 서빙 위치
    root /usr/share/nginx/html;
    index index.html;

    # 🛡️ 보안: backend 폴더 자체와 git, README 파일 접근 원천 차단
    location ~ ^/(backend|\.git|README) {
        deny all;
        return 404;
    }

    # 기본 경로 (루트 폴더)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /sender 폴더 접근 시
    location /sender {
        try_files $uri $uri/ /sender/index.html;
    }

    # /receiver 폴더 접근 시
    location /receiver {
        try_files $uri $uri/ /receiver/index.html;
    }

    # 백엔드 API 라우팅 (환경변수 적용)
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Socket.io 웹소켓 통신을 위한 리버스 프록시 설정 (환경변수 적용)
    location /socket.io/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}