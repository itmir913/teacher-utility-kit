<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <title>교무실 수신기 | 학교 선생님 실시간 호출 시스템</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
          rel="stylesheet"/>

    <style>
        :root {
            --bg: #060d1a;
            --card: #0d1625;
            --card2: #111e30;
            --border: #1e3a5f;
            --amber: #f59e0b;
            --emerald: #10b981;
            --red: #ef4444;
            --blue: #3b82f6;
            --text: #f0f6ff;
            --muted: #64748b;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: linear-gradient(rgba(30, 58, 95, 0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(30, 58, 95, 0.12) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .page {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            animation: fadeIn 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        .glass-card {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            margin: auto;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            background: var(--card2);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            color: var(--text);
            transition: all 0.2s;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }

        .bell-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .bell-option {
            background: var(--card2);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 0.6rem;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .bell-option.selected {
            border-color: var(--blue);
            background: rgba(59, 130, 246, 0.1);
        }

        .btn-main {
            width: 100%;
            padding: 1.1rem;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-size: 1.1rem;
        }

        .btn-blue {
            background: var(--blue);
            color: #fff;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-emerald {
            background: var(--emerald);
            color: #fff;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        #alarm-page {
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .alarm-card {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: var(--card);
            border: 2px solid var(--amber);
            border-radius: 30px;
            padding: 3rem 2rem;
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.2);
        }

        .alarm-icon {
            font-size: 5rem;
            animation: ring-shake 0.5s infinite;
            display: block;
        }

        @keyframes ring-shake {
            0%, 100% {
                transform: rotate(-8deg)
            }
            50% {
                transform: rotate(8deg)
            }
        }

        .floating-btns {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            display: flex;
            gap: 0.75rem;
            z-index: 100;
        }

        .float-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--card2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.2s;
        }

        .float-btn:hover {
            opacity: 1;
            transform: translateY(-2px);
        }

        #log-modal {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        #log-modal.show {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            max-height: 80vh;
        }

        .modal-header {
            padding: 1.2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        .log-list {
            padding: 1rem;
            overflow-y: auto;
            flex: 1;
            font-size: 0.85rem;
        }

        .log-item {
            margin-bottom: 0.4rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toast {
            position: fixed;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--card2);
            border: 1px solid var(--border);
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            z-index: 300;
            transition: 0.3s;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
<div class="bg-grid"></div>

<div id="settings-page" class="page hidden">
    <div class="flex-1 flex flex-col justify-center p-6">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-blue-500">📡 수신부 설정</h1>
        </div>
        <div class="glass-card">
            <div class="form-group">
                <label class="form-label">서버 주소</label>
                <input id="r-server" class="form-input" type="url" placeholder="http://localhost:3000"/>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="form-group">
                    <label class="form-label">Room ID</label>
                    <input id="r-room" class="form-input" type="text" placeholder="room-1"/>
                </div>
                <div class="form-group">
                    <label class="form-label">PIN</label>
                    <input id="r-pin" class="form-input" type="password"/>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="form-group">
                    <label class="form-label">내 이름</label>
                    <input id="r-myname" class="form-input" type="text" placeholder="전체 수신"/>
                </div>
                <div class="form-group">
                    <label class="form-label">자동 닫기 (초)</label>
                    <input id="r-duration" class="form-input" type="number" min="3" max="60" value="5"/>
                </div>
            </div>
            <div class="form-group mb-6">
                <label class="form-label">벨소리 (클릭 시 미리듣기)</label>
                <div class="bell-options">
                    <div class="bell-option selected" data-bell="1" onclick="selectBell(1, this)">🔔 학교 벨</div>
                    <div class="bell-option" data-bell="2" onclick="selectBell(2, this)">🎵 차임</div>
                    <div class="bell-option" data-bell="3" onclick="selectBell(3, this)">📯 알림</div>
                    <div class="bell-option" data-bell="4" onclick="selectBell(4, this)">🎶 부드러운</div>
                </div>
            </div>
            <button class="btn-main btn-blue" onclick="saveSettings()">저장 후 시작하기</button>
        </div>
    </div>
</div>

<div id="waiting-page" class="page hidden">
    <div class="flex-1 flex flex-col justify-center p-6 text-center">
        <div class="glass-card">
            <div class="text-5xl mb-6">🔕</div>
            <h2 class="text-xl font-bold mb-2">수신 준비</h2>
            <p class="text-gray-500 mb-8">벨소리 활성화를 위해 버튼을 눌러주세요.</p>
            <button class="btn-main btn-emerald" onclick="activateAlarm()">수신 시작하기</button>
            <div class="mt-6 text-xs text-gray-500" id="wait-room-label">Room: --</div>
        </div>
    </div>
</div>

<div id="active-page" class="page hidden">
    <div class="flex-1 flex flex-col items-center justify-center p-6">
        <div class="text-7xl mb-6 animate-pulse opacity-50">📡</div>
        <h2 class="text-2xl font-black mb-2">호출벨 감지</h2>
        <p class="text-blue-400 font-medium" id="active-info">서버 연결 중...</p>
    </div>
</div>

<div id="alarm-page" class="page hidden">
    <div class="alarm-card">
        <span class="alarm-icon">🔔</span>
        <div class="text-3xl font-black text-amber-500 my-4" id="alarm-name">-- 선생님</div>
        <p class="text-lg font-medium text-white mb-8">문 앞에 방문객이 있습니다</p>
        <button class="btn-main bg-amber-500 text-black" onclick="confirmAlarm()">확 인</button>
        <p class="text-xs text-gray-600 mt-6" id="alarm-timer-display">--초 후 자동으로 닫힙니다</p>
    </div>
</div>

<div id="log-modal">
    <div class="modal-content">
        <div class="modal-header">
            <span class="font-bold text-blue-400">📄 시스템 기록</span>
            <button onclick="toggleLog()" class="text-gray-500 hover:text-white">닫기</button>
        </div>
        <div class="log-list" id="log-area"></div>
    </div>
</div>

<div class="floating-btns">
    <button class="float-btn" onclick="toggleLog()">📄</button>
    <button class="float-btn" onclick="goToSettings()">⚙️</button>
</div>
<div class="toast" id="toast"></div>

<script>
    let socket = null, audioCtx = null, config = {};
    let isAlarmActive = false, autoCloseTimeout = null, timerInterval = null;

    // ── 오디오 합성 엔진 ──────────────────────────────
    function getAudioCtx() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playBell(n) {
        const ctx = getAudioCtx();
        const t = ctx.currentTime;
        if (n == 1) { // 학교 벨 (단발성 3연음)
            [0, 0.4, 0.8].forEach(delay => {
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(880, t + delay);
                g.gain.setValueAtTime(0, t + delay);
                g.gain.linearRampToValueAtTime(0.3, t + delay + 0.05);
                g.gain.linearRampToValueAtTime(0, t + delay + 0.3);
                osc.connect(g);
                g.connect(ctx.destination);
                osc.start(t + delay);
                osc.stop(t + delay + 0.4);
            });
        } else if (n == 2) { // 차임
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.frequency.setValueAtTime(523.25, t);
            osc.frequency.exponentialRampToValueAtTime(659.25, t + 0.5);
            g.gain.setValueAtTime(0.3, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start();
            osc.stop(t + 1.5);
        } else if (n == 3) { // 알림
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, t);
            g.gain.setValueAtTime(0.1, t);
            g.gain.linearRampToValueAtTime(0, t + 0.2);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start();
            osc.stop(t + 0.2);
        } else { // 부드러운
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(330, t);
            g.gain.setValueAtTime(0.3, t);
            g.gain.exponentialRampToValueAtTime(0.01, t + 2);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start();
            osc.stop(t + 2);
        }
    }

    function selectBell(n, el) {
        config.bell = n;
        document.querySelectorAll('.bell-option').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        getAudioCtx();
        playBell(n); // 미리보기
    }

    // ── 유틸리티 및 암호화 ───────────────────────────
    const getKey = (pin) => CryptoJS.SHA256(pin).toString();
    const decrypt = (enc, pin) => {
        try {
            return JSON.parse(CryptoJS.AES.decrypt(enc, getKey(pin)).toString(CryptoJS.enc.Utf8));
        } catch {
            return null;
        }
    };
    const encrypt = (data, pin) => CryptoJS.AES.encrypt(JSON.stringify(data), getKey(pin)).toString();

    function addLog(msg, type = '') {
        const area = document.getElementById('log-area');
        const d = document.createElement('div');
        d.className = `log-item ${type === 'err' ? 'text-red-400' : type === 'ok' ? 'text-emerald-400' : 'text-gray-400'}`;
        d.innerHTML = `<span class="opacity-40 text-[10px] mr-2">${new Date().toLocaleTimeString()}</span>${msg}`;
        area.prepend(d);
    }

    function toggleLog() {
        document.getElementById('log-modal').classList.toggle('show');
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    // ── 핵심 로직 ─────────────────────────────────────
    function saveSettings() {
        const cfg = {
            server: document.getElementById('r-server').value.trim(),
            room: document.getElementById('r-room').value.trim(),
            pin: document.getElementById('r-pin').value.trim(),
            myname: document.getElementById('r-myname').value.trim(),
            duration: parseInt(document.getElementById('r-duration').value) || 5,
            bell: config.bell || 1
        };
        if (!cfg.server || !cfg.room || !cfg.pin) return showToast('⚠️ 필수 정보를 입력하세요');
        localStorage.setItem('receiver_config_v2', JSON.stringify(cfg));
        config = cfg;
        document.getElementById('wait-room-label').textContent = `Room: ${cfg.room}`;
        showPage('waiting-page');
    }

    function activateAlarm() {
        getAudioCtx();
        showPage('active-page');
        connectSocket();
    }

    function connectSocket() {
        if (socket) socket.disconnect();
        socket = io(config.server);

        socket.on('connect', () => {
            socket.emit('join-room', config.room);
            const activeInfo = document.getElementById('active-info');
            activeInfo.textContent = `✅ ${config.room} 연결됨`;
            activeInfo.classList.remove('text-red-400');
            activeInfo.classList.add('text-blue-400');
            addLog('서버 연결됨', 'ok');
        });

        // 💡 추가됨: 연결 끊김 시 처리
        socket.on('disconnect', () => {
            const activeInfo = document.getElementById('active-info');
            activeInfo.textContent = "❌ 서버 연결 끊김 (재연결 시도 중...)";
            activeInfo.classList.remove('text-blue-400');
            activeInfo.classList.add('text-red-400');
            addLog('서버와 연결이 끊어졌습니다.', 'err');
        });

        socket.on('receive-call', data => {
            const obj = decrypt(data.payload, config.pin);
            if (!obj || (config.myname && obj.target !== config.myname)) return;

            // 💡 추가됨: 호출 수신 로그 기록
            addLog(`호출 수신: ${obj.target} 선생님`, 'ok');

            triggerAlarm(obj);
        });
    }

    function triggerAlarm(obj) {
        // 1. 알람이 이미 실행 중이라면 기존 타이머들을 중지(초기화)합니다. (새 호출로 덮어쓰기)
        if (isAlarmActive) {
            clearInterval(timerInterval);
            clearTimeout(autoCloseTimeout);
        }

        isAlarmActive = true;

        // 2. 호출받은 선생님 이름으로 화면 업데이트 및 팝업 띄우기
        document.getElementById('alarm-name').textContent = obj.target + ' 선생님';
        showPage('alarm-page');

        // 3. 새로운 호출이 올 때마다 벨소리를 딱 한 번 재생
        playBell(config.bell);

        // 4. 남은 시간 초기화 및 화면 표시
        let timeLeft = config.duration;
        const display = document.getElementById('alarm-timer-display');
        display.textContent = `${timeLeft}초 후 자동으로 닫힙니다`;

        // 5. 1초마다 화면의 남은 시간 깎기
        timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                display.textContent = `${timeLeft}초 후 자동으로 닫힙니다`;
            }
        }, 1000);

        // 6. 설정한 시간(duration)이 지나면 자동으로 알람 창 닫기
        autoCloseTimeout = setTimeout(() => confirmAlarm(), config.duration * 1000);

        // 7. 송신부에 "알림 전달됨" 신호(ACK) 보내기
        if (socket?.connected) {
            const ack = encrypt({
                type: 'ack',
                timestamp: Date.now(),
                target: obj.target // ACK에도 누구를 확인했는지 명시
            }, config.pin);
            socket.emit('send-ack', {roomId: config.room, payload: ack});
        }
    }

    function confirmAlarm() {
        isAlarmActive = false;
        clearInterval(timerInterval);
        clearTimeout(autoCloseTimeout);
        showPage('active-page');
    }

    function goToSettings() {
        if (socket) socket.disconnect();
        showPage('settings-page');
    }

    // 초기 실행
    window.addEventListener('load', () => {
        const saved = localStorage.getItem('receiver_config_v2');
        if (saved) {
            config = JSON.parse(saved);
            document.getElementById('r-server').value = config.server;
            document.getElementById('r-room').value = config.room;
            document.getElementById('r-pin').value = config.pin;
            document.getElementById('r-myname').value = config.myname;
            document.getElementById('r-duration').value = config.duration;
            document.getElementById('wait-room-label').textContent = `Room: ${config.room}`;
            showPage('waiting-page');
        } else {
            showPage('settings-page');
        }
    });
</script>
</body>
</html>
