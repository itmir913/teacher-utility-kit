<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>수신기 | 학교 선생님 실시간 호출 시스템</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- CryptoJS (AES-256) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <!-- Socket.io Client -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #060d1a;
      --card: #0d1625;
      --card2: #111e30;
      --border: #1e3a5f;
      --amber: #f59e0b;
      --emerald: #10b981;
      --red: #ef4444;
      --blue: #3b82f6;
      --text: #f0f6ff;
      --muted: #64748b;
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body { min-height: 100dvh; }

    /* ── 배경 ── */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(30,58,95,0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,58,95,0.12) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .page {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      width: 100%; min-height: 100dvh;
    }
    .hidden { display: none !important; }

    /* ════════════════════════════════════
       설정 모드
    ════════════════════════════════════ */
    #settings-page {
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1.5rem;
      overflow-y: auto;
    }
    .settings-header {
      text-align: center; margin-bottom: 2rem;
    }
    .settings-header h1 {
      font-size: 1.5rem; font-weight: 800;
      color: var(--blue);
    }
    .settings-header p { font-size: 0.85rem; color: var(--muted); margin-top: 0.3rem; }

    .settings-card {
      width: 100%; max-width: 500px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 4px 30px rgba(0,0,0,0.4);
    }

    .form-group { margin-bottom: 1.4rem; }
    .form-label {
      display: block; font-size: 0.8rem; font-weight: 700;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.08em; margin-bottom: 0.5rem;
    }
    .form-input {
      width: 100%;
      background: var(--card2); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 0.9rem 1rem;
      color: var(--text); font-size: 1rem;
      font-family: 'Noto Sans KR', sans-serif;
      transition: border-color 0.2s; outline: none;
    }
    .form-input:focus { border-color: var(--blue); }
    .form-hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.35rem; }

    /* 벨소리 선택 */
    .bell-options {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0.6rem; margin-top: 0.3rem;
    }
    .bell-option {
      background: var(--card2); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 0.75rem 0.5rem;
      text-align: center; cursor: pointer;
      transition: all 0.2s;
    }
    .bell-option.selected {
      border-color: var(--blue);
      background: rgba(59,130,246,0.1);
    }
    .bell-option .bell-icon { font-size: 1.6rem; display: block; margin-bottom: 0.3rem; }
    .bell-option .bell-name { font-size: 0.75rem; font-weight: 600; color: var(--muted); }
    .bell-option.selected .bell-name { color: var(--blue); }
    .bell-preview {
      display: flex; align-items: center; gap: 0.4rem;
      margin-top: 0.25rem;
    }
    .preview-btn {
      font-size: 0.7rem; color: var(--muted);
      background: none; border: none;
      cursor: pointer; text-decoration: underline;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .preview-btn:hover { color: var(--text); }

    .btn-save {
      width: 100%; padding: 1rem;
      background: var(--blue); color: #fff;
      border: none; border-radius: 12px;
      font-size: 1.1rem; font-weight: 800;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer; transition: all 0.2s;
      margin-top: 0.5rem;
      box-shadow: 0 0 20px rgba(59,130,246,0.3);
    }
    .btn-save:hover {
      background: #2563eb; transform: translateY(-1px);
    }

    /* ════════════════════════════════════
       대기 모드
    ════════════════════════════════════ */
    #waiting-page {
      align-items: center; justify-content: center;
      gap: 2rem; padding: 2rem;
    }

    .wait-header {
      text-align: center;
    }
    .wait-header h2 { font-size: 1.3rem; font-weight: 700; }
    .wait-header p { font-size: 0.85rem; color: var(--muted); margin-top: 0.3rem; }

    .wait-card {
      width: 100%; max-width: 400px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 2rem;
      text-align: center; box-shadow: 0 4px 30px rgba(0,0,0,0.3);
    }
    .wait-icon { font-size: 4rem; margin-bottom: 1rem; }
    .wait-desc {
      font-size: 0.9rem; color: var(--muted); margin-bottom: 1.5rem; line-height: 1.6;
    }

    .btn-activate {
      width: 100%; padding: 1.1rem;
      background: linear-gradient(135deg, var(--emerald), #059669);
      color: #fff; border: none; border-radius: 12px;
      font-size: 1.1rem; font-weight: 800;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer; transition: all 0.2s;
      box-shadow: 0 0 25px rgba(16,185,129,0.35);
    }
    .btn-activate:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(16,185,129,0.5);
    }
    .btn-activate:active { transform: translateY(0); }

    .conn-status {
      display: flex; align-items: center; gap: 0.5rem;
      justify-content: center; font-size: 0.8rem; color: var(--muted);
    }
    .s-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); transition: all 0.3s;
    }
    .s-dot.on { background: var(--emerald); box-shadow: 0 0 8px var(--emerald); }
    .s-dot.err { background: var(--red); }

    /* ════════════════════════════════════
       알람 모드
    ════════════════════════════════════ */
    #alarm-page {
      align-items: center; justify-content: center;
      padding: 2rem; gap: 2rem;
      transition: background 0.2s;
    }
    #alarm-page.flash-on {
      background: rgba(245, 158, 11, 0.15);
    }

    .alarm-card {
      width: 100%; max-width: 480px;
      background: var(--card);
      border: 2px solid var(--amber);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow:
        0 0 60px rgba(245,158,11,0.25),
        0 0 0 1px rgba(245,158,11,0.1) inset;
    }

    .alarm-icon {
      font-size: 5rem;
      animation: ring-shake 0.5s ease infinite;
      display: block; margin-bottom: 1.5rem;
    }
    @keyframes ring-shake {
      0%, 100% { transform: rotate(-8deg); }
      50%       { transform: rotate(8deg); }
    }

    .alarm-msg-small { font-size: 1rem; color: var(--muted); margin-bottom: 0.5rem; }
    .alarm-msg-main {
      font-size: 1.8rem; font-weight: 900;
      color: var(--amber); line-height: 1.3;
      margin-bottom: 0.75rem;
      word-break: keep-all;
    }
    .alarm-sub {
      font-size: 1.1rem; font-weight: 500;
      color: var(--text); margin-bottom: 2rem;
    }

    .alarm-time { font-size: 0.85rem; color: var(--muted); margin-bottom: 1.5rem; }

    .btn-confirm {
      width: 100%; padding: 1.2rem;
      background: var(--amber);
      color: #0a0a0a; border: none; border-radius: 14px;
      font-size: 1.3rem; font-weight: 900;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer; transition: all 0.2s;
      box-shadow: 0 0 30px rgba(245,158,11,0.4);
    }
    .btn-confirm:hover {
      background: #fbbf24; transform: translateY(-2px);
    }
    .btn-confirm:active { transform: translateY(0); }

    /* 히든 기어 버튼 */
    .gear-btn {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--card2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; cursor: pointer;
      opacity: 0.3; transition: opacity 0.2s; z-index: 100;
    }
    .gear-btn:hover { opacity: 0.8; }

    /* 토스트 */
    .toast {
      position: fixed; top: 1rem; left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.75rem 1.5rem;
      font-size: 0.9rem; font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      z-index: 200; transition: transform 0.3s ease; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--emerald); color: var(--emerald); }
    .toast.error { border-color: var(--red); color: var(--red); }

    /* 로그 영역 */
    .log-area {
      width: 100%; max-width: 400px;
      max-height: 100px; overflow-y: auto;
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.75rem;
      font-size: 0.72rem; color: var(--muted);
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .log-entry { margin-bottom: 0.2rem; }
    .log-entry.ok { color: var(--emerald); }
    .log-entry.warn { color: #f59e0b; }
    .log-entry.err { color: var(--red); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

<div class="bg-grid"></div>

<!-- ════════ 설정 페이지 ════════ -->
<div id="settings-page" class="page hidden">
  <div class="settings-header">
    <h1>📡 수신부 설정</h1>
    <p>호출을 받는 기기입니다</p>
  </div>

  <div class="settings-card">
    <div class="form-group">
      <label class="form-label">서버 주소 (Socket.io)</label>
      <input id="r-server" class="form-input" type="url" placeholder="https://your-server.com" />
    </div>
    <div class="form-group">
      <label class="form-label">Room ID</label>
      <input id="r-room" class="form-input" type="text" placeholder="예: school-room-01" />
    </div>
    <div class="form-group">
      <label class="form-label">PIN 번호 (암호화 키)</label>
      <input id="r-pin" class="form-input" type="password" placeholder="송신부와 동일한 PIN" />
    </div>
    <div class="form-group">
      <label class="form-label">내 이름 (선택 — 비워두면 모든 호출 수신)</label>
      <input id="r-myname" class="form-input" type="text" placeholder="예: 김철수 (선택사항)" />
      <p class="form-hint">이름을 입력하면 나에게 온 호출만 알림</p>
    </div>
    <div class="form-group">
      <label class="form-label">알림 벨소리</label>
      <div class="bell-options" id="bell-options">
        <div class="bell-option selected" data-bell="1" onclick="selectBell(1, this)">
          <span class="bell-icon">🔔</span>
          <span class="bell-name">학교 벨</span>
          <div class="bell-preview">
            <button class="preview-btn" onclick="event.stopPropagation(); previewBell(1)">▶ 미리듣기</button>
          </div>
        </div>
        <div class="bell-option" data-bell="2" onclick="selectBell(2, this)">
          <span class="bell-icon">🎵</span>
          <span class="bell-name">맑은 차임</span>
          <div class="bell-preview">
            <button class="preview-btn" onclick="event.stopPropagation(); previewBell(2)">▶ 미리듣기</button>
          </div>
        </div>
        <div class="bell-option" data-bell="3" onclick="selectBell(3, this)">
          <span class="bell-icon">📯</span>
          <span class="bell-name">알림음</span>
          <div class="bell-preview">
            <button class="preview-btn" onclick="event.stopPropagation(); previewBell(3)">▶ 미리듣기</button>
          </div>
        </div>
        <div class="bell-option" data-bell="4" onclick="selectBell(4, this)">
          <span class="bell-icon">🎶</span>
          <span class="bell-name">부드러운 벨</span>
          <div class="bell-preview">
            <button class="preview-btn" onclick="event.stopPropagation(); previewBell(4)">▶ 미리듣기</button>
          </div>
        </div>
      </div>
      <p class="form-hint" style="margin-top:0.6rem">
        ※ /assets/ 폴더에 bell1.mp3~bell4.mp3를 두면 자동 사용됩니다.<br>
        MP3가 없으면 합성음이 재생됩니다.
      </p>
    </div>
    <button class="btn-save" onclick="saveSettings()">✅ 저장하고 시작</button>
  </div>
</div>

<!-- ════════ 대기 페이지 ════════ -->
<div id="waiting-page" class="page hidden">
  <div class="wait-header">
    <h2>📡 수신부 대기 중</h2>
    <p id="wait-room-label">Room: —</p>
  </div>

  <div class="wait-card">
    <div class="wait-icon">🔕</div>
    <p class="wait-desc">
      사무실 환경 고려로<br/>
      아래 버튼을 눌러야 알림이 활성화됩니다.<br/>
      (오디오 권한 획득)
    </p>
    <button class="btn-activate" onclick="activateAlarm()">
      🔔 알람 활성화 및 시작
    </button>
  </div>

  <div class="conn-status">
    <span class="s-dot" id="wait-dot"></span>
    <span id="wait-status-text">연결 준비 중...</span>
  </div>
</div>

<!-- ════════ 수신 대기 (활성) 페이지 ════════ -->
<div id="active-page" class="page hidden">
  <div style="text-align:center; margin-top: 3rem; margin-bottom: 1.5rem;">
    <div style="font-size:5rem; animation: pulse 2s ease infinite;">📡</div>
    <h2 style="font-size:1.4rem; font-weight:800; margin-top:1rem;">호출 대기 중</h2>
    <p style="font-size:0.9rem; color:var(--muted); margin-top:0.4rem;" id="active-info">연결 중...</p>
  </div>

  <div class="log-area" id="log-area">
    <div class="log-entry">시스템 시작...</div>
  </div>

  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50%       { transform: scale(1.05); opacity: 1; }
    }
  </style>
</div>

<!-- ════════ 알람 페이지 ════════ -->
<div id="alarm-page" class="page hidden">
  <div class="alarm-card">
    <span class="alarm-icon">🔔</span>
    <p class="alarm-msg-small">호출이 왔습니다!</p>
    <div class="alarm-msg-main" id="alarm-name">— 선생님</div>
    <div class="alarm-sub">문 앞에 손님이 오셨습니다!</div>
    <div class="alarm-time" id="alarm-time"></div>
    <button class="btn-confirm" onclick="confirmAlarm()">✅ 확 인</button>
  </div>
</div>

<!-- 설정 톱니바퀴 -->
<button class="gear-btn" id="gear-btn" onclick="goToSettings()" title="설정으로 돌아가기">⚙️</button>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script>
// ─── 상태 ───────────────────────────────────────────
let socket = null;
let audioCtx = null;
let selectedBell = 1;
let config = {};
let isAlarmActive = false;
let flashInterval = null;
let bellLoopInterval = null;
let alarmFlashOn = false;

// ─── 암호화 ──────────────────────────────────────────
function getKey(pin) {
  return CryptoJS.SHA256(pin).toString();
}
function decrypt(encStr, pin) {
  try {
    const bytes = CryptoJS.AES.decrypt(encStr, getKey(pin));
    return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
  } catch { return null; }
}
function encrypt(data, pin) {
  return CryptoJS.AES.encrypt(JSON.stringify(data), getKey(pin)).toString();
}

// ─── 토스트 ──────────────────────────────────────────
let toastTimer = null;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3500);
}

// ─── 로그 ─────────────────────────────────────────────
function addLog(msg, cls = '') {
  const area = document.getElementById('log-area');
  if (!area) return;
  const d = document.createElement('div');
  d.className = 'log-entry ' + cls;
  d.textContent = `[${new Date().toLocaleTimeString('ko-KR')}] ${msg}`;
  area.appendChild(d);
  area.scrollTop = area.scrollHeight;
}

// ─── 벨소리 선택 ──────────────────────────────────────
function selectBell(n, el) {
  selectedBell = n;
  document.querySelectorAll('.bell-option').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

// ─── Web Audio API 벨소리 합성 ───────────────────────
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playBell(n) {
  const ctx = getAudioCtx();

  if (n === 1) {
    // 🔔 학교 벨 — 짧은 버즈 × 4
    const buzzes = [0, 0.35, 0.7, 1.05];
    buzzes.forEach(t => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0, ctx.currentTime + t);
      gain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + t + 0.01);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + t + 0.25);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + 0.3);
    });
  } else if (n === 2) {
    // 🎵 맑은 차임 — 하모닉 사인파
    const freqs = [523, 659, 784, 1047];
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      const t = ctx.currentTime + i * 0.22;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.3, t + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 1.3);
    });
  } else if (n === 3) {
    // 📯 알림음 — 두 음 연속
    [[660, 0], [880, 0.18]].forEach(([f, t]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = f;
      const st = ctx.currentTime + t;
      gain.gain.setValueAtTime(0.25, st);
      gain.gain.exponentialRampToValueAtTime(0.001, st + 0.15);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(st); osc.stop(st + 0.2);
    });
  } else {
    // 🎶 부드러운 벨 — 느리게 감쇠하는 사인파
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(740, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.8);
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 2.1);
  }
}

// MP3 우선 시도, 없으면 합성음
async function playBellSound(n) {
  const paths = [
    `../assets/bell${n}.mp3`,
    `assets/bell${n}.mp3`,
  ];
  for (const path of paths) {
    try {
      const ctx = getAudioCtx();
      const res = await fetch(path);
      if (!res.ok) throw new Error('fetch failed');
      const buf = await res.arrayBuffer();
      const decoded = await ctx.decodeAudioData(buf);
      const src = ctx.createBufferSource();
      src.buffer = decoded;
      src.connect(ctx.destination);
      src.start();
      return; // 성공 시 반환
    } catch { /* MP3 없음, 다음 시도 */ }
  }
  // 모두 실패 → 합성음
  playBell(n);
}

function previewBell(n) {
  // 설정 모드에서 미리듣기 (audioCtx가 없으면 생성)
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  playBell(n);
}

// ─── 설정 저장/로드 ──────────────────────────────────
function saveSettings() {
  const server = document.getElementById('r-server').value.trim();
  const room   = document.getElementById('r-room').value.trim();
  const pin    = document.getElementById('r-pin').value.trim();
  const myname = document.getElementById('r-myname').value.trim();

  if (!server || !room || !pin) {
    showToast('⚠️ 서버 주소, Room ID, PIN을 입력해주세요', 'error');
    return;
  }

  const cfg = { server, room, pin, myname, bell: selectedBell };
  localStorage.setItem('receiver_config', JSON.stringify(cfg));
  goToWaiting(cfg);
}

function loadSettings() {
  try {
    const raw = localStorage.getItem('receiver_config');
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function goToSettings() {
  if (socket) { socket.disconnect(); socket = null; }
  stopAlarm();
  showPage('settings-page');
  document.getElementById('gear-btn').classList.add('hidden');
}

// ─── 페이지 전환 ──────────────────────────────────────
function showPage(id) {
  ['settings-page','waiting-page','active-page','alarm-page'].forEach(p => {
    document.getElementById(p).classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');
}

// ─── 대기 모드 ────────────────────────────────────────
function goToWaiting(cfg) {
  config = cfg;
  selectedBell = cfg.bell || 1;
  document.getElementById('wait-room-label').textContent = `Room: ${cfg.room}${cfg.myname ? ' · ' + cfg.myname + ' 선생님' : ''}`;
  showPage('waiting-page');
  document.getElementById('gear-btn').classList.remove('hidden');
  setWaitStatus('', '버튼을 눌러 활성화하세요');
}

function setWaitStatus(cls, text) {
  const dot = document.getElementById('wait-dot');
  const txt = document.getElementById('wait-status-text');
  if (dot) { dot.className = 's-dot ' + cls; }
  if (txt) { txt.textContent = text; }
}

// ─── 알람 활성화 (사용자 제스처 필요) ─────────────────
function activateAlarm() {
  // 오디오 컨텍스트를 사용자 제스처에서 생성 → 자동재생 정책 통과
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  // 짧은 무음 재생으로 권한 완전 획득
  const silentBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
  const src = audioCtx.createBufferSource();
  src.buffer = silentBuf;
  src.connect(audioCtx.destination);
  src.start();

  showPage('active-page');
  connectSocket(config);
  document.getElementById('active-info').textContent =
    `Room: ${config.room}${config.myname ? ' · ' + config.myname + ' 선생님' : ''} · 연결 중...`;
  addLog('오디오 활성화 및 소켓 연결 시작', 'ok');
}

// ─── 소켓 연결 ───────────────────────────────────────
function connectSocket(cfg) {
  if (socket) socket.disconnect();

  socket = io(cfg.server, {
    reconnectionAttempts: Infinity,
    reconnectionDelay: 2000,
    timeout: 10000
  });

  socket.on('connect', () => {
    socket.emit('join-room', cfg.room);
    document.getElementById('active-info').textContent =
      `Room: ${cfg.room}${cfg.myname ? ' · ' + cfg.myname + ' 선생님' : ''} · 연결됨 ✅`;
    addLog('서버 연결 성공', 'ok');
  });

  socket.on('joined', (data) => {
    addLog(`룸 입장 완료 (${data.members}명 접속 중)`, 'ok');
  });

  socket.on('receive-call', (data) => {
    handleCall(data.payload);
  });

  socket.on('disconnect', () => {
    document.getElementById('active-info').textContent = '연결 끊김 — 재연결 중...';
    addLog('연결 끊김, 재연결 시도 중...', 'warn');
  });

  socket.on('connect_error', (e) => {
    addLog(`연결 오류: ${e.message}`, 'err');
  });
}

// ─── 호출 수신 처리 ────────────────────────────────────
function handleCall(payload) {
  addLog(`암호화 데이터 수신 (${payload.length}자)`);

  const obj = decrypt(payload, config.pin);

  if (!obj) {
    addLog('복호화 실패 — PIN 불일치 또는 장난 신호, 무시', 'warn');
    return;
  }
  if (obj.type !== 'call') {
    addLog(`알 수 없는 타입: ${obj.type}`, 'warn');
    return;
  }

  // 이름 필터링 (내 이름이 설정된 경우에만)
  if (config.myname && obj.target !== config.myname) {
    addLog(`다른 대상 호출 (${obj.target} 선생님) — 무시`);
    return;
  }

  addLog(`✅ 호출 수신 — 대상: ${obj.target} 선생님`, 'ok');
  triggerAlarm(obj);
}

// ─── 알람 시작 ────────────────────────────────────────
function triggerAlarm(obj) {
  if (isAlarmActive) return; // 중복 방지
  isAlarmActive = true;

  const name = obj.target;
  const timeStr = new Date(obj.timestamp).toLocaleString('ko-KR');

  document.getElementById('alarm-name').textContent = name + ' 선생님';
  document.getElementById('alarm-time').textContent = `호출 시각: ${timeStr}`;

  showPage('alarm-page');

  // 화면 깜빡임
  flashInterval = setInterval(() => {
    alarmFlashOn = !alarmFlashOn;
    const page = document.getElementById('alarm-page');
    if (alarmFlashOn) {
      page.style.backgroundColor = 'rgba(245,158,11,0.18)';
    } else {
      page.style.backgroundColor = '';
    }
  }, 700);

  // 벨소리 반복 재생
  playBellSound(config.bell || 1);
  bellLoopInterval = setInterval(() => {
    playBellSound(config.bell || 1);
  }, 3500);

  // 확인 ACK 전송 (송신부에 알림)
  if (socket && socket.connected) {
    const ack = encrypt({
      type: 'ack',
      confirmedBy: config.myname || obj.target,
      timestamp: Date.now()
    }, config.pin);
    socket.emit('send-ack', { roomId: config.room, payload: ack });
  }
}

// ─── 알람 정지 ────────────────────────────────────────
function stopAlarm() {
  isAlarmActive = false;
  clearInterval(flashInterval);
  clearInterval(bellLoopInterval);
  document.getElementById('alarm-page').style.backgroundColor = '';
}

function confirmAlarm() {
  stopAlarm();
  showPage('active-page');
  addLog('호출 확인 완료', 'ok');
  showToast('✅ 확인되었습니다', 'success');
}

// ─── 초기 진입 ───────────────────────────────────────
window.addEventListener('load', () => {
  const cfg = loadSettings();

  if (cfg) {
    // 설정 폼 미리 채우기
    document.getElementById('r-server').value = cfg.server || '';
    document.getElementById('r-room').value   = cfg.room   || '';
    document.getElementById('r-pin').value    = cfg.pin    || '';
    document.getElementById('r-myname').value = cfg.myname || '';
    selectedBell = cfg.bell || 1;
    // 벨 선택 UI 반영
    document.querySelectorAll('.bell-option').forEach(el => {
      el.classList.remove('selected');
      if (parseInt(el.dataset.bell) === selectedBell) el.classList.add('selected');
    });
    goToWaiting(cfg);
  } else {
    showPage('settings-page');
    document.getElementById('gear-btn').classList.add('hidden');
  }
});
</script>
</body>
</html>
