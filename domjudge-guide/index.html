<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DOMjudge 9.0.0 구축 가이드</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
          rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css"/>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased text-base">

<header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
        <div class="flex items-center gap-2">
            <span class="font-bold text-slate-900 text-xl tracking-tight">
                DOMjudge <span class="text-blue-600">구축 가이드</span>
            </span>
        </div>
    </nav>
</header>

<div class="max-w-6xl mx-auto px-4 sm:px-6 mt-6 flex flex-col lg:flex-row gap-6">

    <aside class="sticky top-24 z-50 w-full lg:w-52 shrink-0 self-start shadow-sm lg:shadow-none">
        <div class="scard overflow-hidden bg-white">
            <div class="hidden lg:block px-4 py-3 bg-gradient-to-r from-blue-700 to-cyan-600">
                <p class="text-base font-semibold text-white uppercase tracking-widest">목차</p>
            </div>
            <nav class="flex lg:flex-col px-2 py-1 lg:p-2 gap-1 overflow-x-auto overflow-y-hidden">
                <a href="#overview" data-link
                   class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">개요</a>
                <a href="#server" data-link
                   class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">리눅스
                    서버 준비</a>
                <a href="#install-domjudge" data-link
                   class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">DOMjudge
                    설치</a>
                <a href="#network" data-link
                   class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">네트워크
                    구성</a>
                <a href="#problems" data-link
                   class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">문제(Problem)
                    준비</a>
                <a href="#contest" data-link
                   class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">대회(Contest)
                    설정</a>
                <a href="#test" data-link
                   class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">스트레스
                    테스트</a>
                <a href="#troubleshooting" data-link
                   class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">트러블슈팅</a>
            </nav>
        </div>
    </aside>

    <main id="app" class="flex-1 min-w-0 space-y-6 scroll-mt-24 pt-2 pb-8 min-h-screen"></main>
</div>

<script src="./app.js"></script>
<script>
async function printManual() {
    const PAGES = [
        'overview', 'server', 'install-domjudge',
        'network', 'problems', 'contest', 'test', 'troubleshooting'
    ];

    const popup = window.open('', '_blank', 'width=1100,height=860,scrollbars=yes,resizable=yes');
    if (!popup) {
        alert('팝업이 차단되었습니다. 브라우저의 팝업 차단을 해제하고 다시 시도해주세요.');
        return;
    }

    popup.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
        <title>DOMjudge 구축 가이드</title>
        <style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;
        font-family:'Noto Sans KR',sans-serif;color:#64748b;font-size:16px;background:#f8fafc;}</style>
        </head><body>문서를 불러오는 중입니다…</body></html>`);

    try {
        const htmlParts = await Promise.all(PAGES.map(async (page) => {
            const res = await fetch(`pages/${page}.html`);
            const text = await res.text();
            const doc = new DOMParser().parseFromString(text, 'text/html');
            const section = doc.querySelector('section');
            if (!section) return '';
            section.classList.remove('fi');
            return section.outerHTML;
        }));

        const printDoc = `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOMjudge 구축 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"><\/script>
<style>
body { font-family: 'Noto Sans KR', sans-serif; background: #f8fafc; color: #1e293b; -webkit-font-smoothing: antialiased; }
code, pre { font-family: 'Noto Sans KR', sans-serif; }
.scard { background: #fff; border-radius: 1rem; border: 1px solid #e2e8f0; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
.accent-bar { height: 4px; background: linear-gradient(90deg, #2563eb, #0ea5e9); border-top-left-radius: calc(1rem - 1px); border-top-right-radius: calc(1rem - 1px); }
pre { background-color: #0f172a; border-radius: 0.5rem; overflow-x: auto; }

@media screen {
    #print-container { max-width: 960px; margin: 0 auto; padding: 40px 60px 100px; }
    section { margin-bottom: 60px; }
    #print-btn { position: fixed; bottom: 28px; right: 28px; padding: 12px 24px;
        background: #2563eb; color: white; border: none; border-radius: 10px;
        font-size: 16px; cursor: pointer; font-family: inherit; font-weight: 600;
        box-shadow: 0 4px 14px rgba(37,99,235,0.4); }
    #print-btn:hover { background: #1d4ed8; }
}

@media print {
    @page { size: A4; margin: 15mm; }
    body { font-size: 10pt; background: white; }
    #print-btn { display: none !important; }
    section + section { page-break-before: always; break-before: page; }
    pre { max-height: none !important; overflow: visible !important;
          background-color: #f1f5f9 !important; color: #1e293b !important; }
    pre code, pre span { color: #1e293b !important; }
    * { box-shadow: none !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important; }
    a { color: inherit !important; text-decoration: none !important; }
    table, .bg-white, .bg-slate-50, .bg-slate-100,
    .bg-rose-50, .bg-amber-50, .bg-indigo-50, .bg-emerald-50 {
        break-inside: avoid;
        page-break-inside: avoid;
    }
    h3, h4 { break-after: avoid; page-break-after: avoid; }
}
</style>
</head>
<body>
<button id="print-btn" onclick="window.print()">🖨 인쇄 / PDF 저장</button>
<div id="print-container">
${htmlParts.join('\n')}
</div>
<script>
window.addEventListener('load', function () {
    setTimeout(function () { window.print(); }, 1000);
});
<\/script>
</body>
</html>`;

        popup.document.open();
        popup.document.write(printDoc);
        popup.document.close();

    } catch (e) {
        popup.document.open();
        popup.document.write('<!DOCTYPE html><html><body style="padding:20px;font-family:sans-serif;color:red;">'
            + '<p>오류가 발생했습니다: ' + e.message + '</p></body></html>');
        popup.document.close();
    }
}
</script>
</body>
</html>
