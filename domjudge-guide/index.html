<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DOMjudge 9.0.0 구축 가이드</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
          rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased text-base">

<header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
        <div class="flex items-center gap-2">
            <span class="font-bold text-slate-900 text-xl tracking-tight">
                DOMjudge <span class="text-blue-600">구축 가이드</span>
            </span>
        </div>
    </nav>
</header>

<div class="max-w-6xl mx-auto px-4 sm:px-6 mt-6 flex flex-col lg:flex-row gap-6">

    <aside class="sticky top-24 z-50 w-full lg:w-52 shrink-0 self-start shadow-sm lg:shadow-none">
        <div class="scard overflow-hidden bg-white">
            <div class="hidden lg:block px-4 py-3 bg-gradient-to-r from-blue-700 to-cyan-600">
                <p class="text-base font-semibold text-white uppercase tracking-widest">목차</p>
            </div>
            <nav class="flex lg:flex-col px-2 py-1 lg:p-2 gap-1 overflow-x-auto overflow-y-hidden">
                <a href="#overview" data-link
                   class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">개요</a>
                <a href="#server" data-link
                   class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">리눅스
                    서버 준비</a>
                <a href="#install-domjudge" data-link
                   class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">DOMjudge
                    설치</a>
                <a href="#contest" data-link
                   class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">대회(Contest)
                    설정</a>
                <a href="#problems" data-link
                   class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">문제(Problem)
                    준비</a>
                <a href="#network" data-link
                   class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">네트워크
                    구성</a>
                <a href="#test" data-link
                   class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">스트레스
                    테스트</a>
                <a href="#troubleshooting" data-link
                   class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">트러블슈팅</a>
            </nav>
        </div>
    </aside>

    <main id="app" class="flex-1 min-w-0 space-y-6 scroll-mt-24 pt-2 pb-8 min-h-screen"></main>
</div>

<script src="./app.js"></script>
</body>
</html>
