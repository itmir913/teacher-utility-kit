<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DOMjudge 9.0.0 구축 가이드</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
          rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html {
            scroll-behavior: smooth;
            overflow-y: scroll;
        }

        body {
            font-family: 'Noto Sans KR', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Roboto', 'noto sans', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
        }

        /* Fade in 애니메이션 */
        @keyframes fi {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fi {
            animation: fi 0.3s ease both;
        }

        .scard {
            background: #fff;
            border-radius: 1rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .05);
        }

        .accent-bar {
            height: 4px;
            background: linear-gradient(90deg, #2563eb, #0ea5e9);
            border-top-left-radius: calc(1rem - 1px);
            border-top-right-radius: calc(1rem - 1px);
        }

        /* ─── 스크롤바 (얇고 세련되게) ─── */

        /* 1. 웹킷 브라우저 (Chrome, Safari, Edge) - 전체 스크롤바 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent; /* 배경을 투명하게 하여 둥둥 떠있는 느낌 부여 */
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; /* Slate 300 */
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; /* Slate 400 */
        }

        /* 2. 특정 영역 전용 스크롤바 (.custom-scrollbar 클래스 사용 시) */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc; /* Slate 50: 영역 내부에서는 트랙 배경색을 연하게 표시 */
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* 3. 파이어폭스 대응 (전체 기본 적용) */
        * {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        .custom-scrollbar {
            scrollbar-color: #cbd5e1 #f8fafc;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased text-base">

<header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
        <div class="flex items-center gap-2">
            <span class="font-bold text-slate-900 text-xl tracking-tight">
                DOMjudge <span class="text-blue-600">구축 가이드</span>
            </span>
        </div>
    </nav>
</header>

<div class="max-w-6xl mx-auto px-4 sm:px-6 py-8 flex flex-col lg:flex-row gap-5">

    <aside class="w-full lg:w-52 flex-shrink-0">
        <div class="sticky top-16 lg:top-24 z-40">
            <div class="scard overflow-hidden">
                <div class="hidden lg:block px-4 py-3 bg-gradient-to-r from-blue-700 to-cyan-600">
                    <p class="text-base font-semibold text-white uppercase tracking-widest">목차</p>
                </div>

                <nav class="flex lg:flex-col p-2 gap-1 overflow-x-auto custom-scrollbar">
                    <a href="#overview" data-link
                       class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">개요</a>
                    <a href="#server" data-link
                       class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">서버
                        구성</a>
                    <a href="#network" data-link
                       class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">네트워크</a>
                    <a href="#contest" data-link
                       class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">대회
                        설정</a>
                    <a href="#problems" data-link
                       class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">문제
                        관리</a>
                    <a href="#troubleshooting" data-link
                       class="flex-1 lg:flex-none whitespace-nowrap block px-3 py-2 text-base text-slate-600 rounded-lg hover:bg-slate-100 text-center lg:text-left">트러블슈팅</a>
                </nav>
            </div>
        </div>
    </aside>

    <main id="app" class="flex-1 min-w-0 space-y-6"></main>

</div>

<script src="./app.js"></script>
</body>
</html>
