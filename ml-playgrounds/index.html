    const SUPPORTED = ['ko', 'en'];
    const FALLBACK = 'ko';
    const STORAGE_KEY = 'mlp-landing-lang';

    // 단계마다의 색. 준비(1·2) → 학습(3) → 확인(4·5) → 정리(6).
    const STEP_TONES = [
        { circle: 'bg-indigo-500', badge: 'bg-indigo-50 text-indigo-700 border-indigo-200', dot: 'text-indigo-400', icon: 'fa-table-list' },
        { circle: 'bg-indigo-500', badge: 'bg-indigo-50 text-indigo-700 border-indigo-200', dot: 'text-indigo-400', icon: 'fa-sliders' },
        { circle: 'bg-indigo-600', badge: 'bg-indigo-50 text-indigo-700 border-indigo-200', dot: 'text-indigo-400', icon: 'fa-brain' },
        { circle: 'bg-emerald-500', badge: 'bg-emerald-50 text-emerald-700 border-emerald-200', dot: 'text-emerald-400', icon: 'fa-chart-column' },
        { circle: 'bg-emerald-500', badge: 'bg-emerald-50 text-emerald-700 border-emerald-200', dot: 'text-emerald-400', icon: 'fa-wand-magic-sparkles' },
        { circle: 'bg-amber-500', badge: 'bg-amber-50 text-amber-700 border-amber-200', dot: 'text-amber-400', icon: 'fa-feather-pointed' }
    ];

    function pickLocale() {
        const fromQuery = new URLSearchParams(location.search).get('lang');
        if (SUPPORTED.includes(fromQuery)) return fromQuery;

        let stored = null;
        try {
            stored = localStorage.getItem(STORAGE_KEY);
        } catch (e) {
            // 사생활 보호 모드 등에서 접근이 막히면 그냥 브라우저 언어를 본다.
        }
        if (SUPPORTED.includes(stored)) return stored;

        const preferred = navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || FALLBACK];
        for (const tag of preferred) {
            const base = String(tag).toLowerCase().split('-')[0];
            if (SUPPORTED.includes(base)) return base;
        }
        return FALLBACK;
    }

    function renderSteps(dict) {
        const html = STEP_TONES.map((tone, i) => {
            const n = i + 1;
            const items = dict['flow.' + n + '.items']
                .map(item => `
                    <li class="flex items-start gap-3">
                        <i class="fa-solid fa-circle-dot ${tone.dot} mt-1.5 flex-shrink-0 text-sm"></i>
                        <span>${item}</span>
                    </li>`)
                .join('');

            return `
            <div class="relative flex gap-6 md:gap-10 items-start py-4">
                <div class="relative flex-shrink-0 w-16 flex flex-col items-center">
                    <div class="w-16 h-16 rounded-full ${tone.circle} text-white flex items-center justify-center text-2xl font-bold shadow-md z-10">
                        ${n}
                    </div>
                </div>
                <div class="bg-white rounded-3xl border border-slate-200 shadow-lg p-8 flex-1 hover:shadow-xl transition-shadow">
                    <div class="flex flex-wrap items-center gap-3 mb-5">
                        <span class="px-3 py-1.5 ${tone.badge} border text-base font-bold rounded-xl">
                            <i class="fa-solid ${tone.icon} mr-1.5"></i>${dict['flow.' + n + '.badge']}
                        </span>
                        <h3 class="text-2xl font-bold text-slate-800">${dict['flow.' + n + '.title']}</h3>
                    </div>
                    <ul class="space-y-3 text-slate-600 text-lg">${items}</ul>
                </div>
            </div>`;
        }).join('');

        document.getElementById('flow-steps').innerHTML = html;
    }

    function renderPrivacy(dict) {
        document.getElementById('privacy-rows').innerHTML = dict['privacy.rows']
            .map(([term, body]) => `
            <div class="flex flex-col sm:flex-row sm:items-baseline gap-2 sm:gap-8 py-5">
                <span class="shrink-0 sm:w-56 text-lg font-bold text-slate-800">${term}</span>
                <p class="text-lg leading-relaxed text-slate-600">${body}</p>
            </div>`)
            .join('');
    }

    function applyLocale(locale) {
        const dict = I18N[locale] || I18N[FALLBACK];

        document.documentElement.lang = locale;
        document.title = dict['meta.title'];
        document.getElementById('meta-description').setAttribute('content', dict['meta.desc']);

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const value = dict[el.dataset.i18n];
            if (typeof value === 'string') {
                el.innerHTML = value;
            } else if (Array.isArray(value)) {
                el.innerHTML = value
                    .map(item => `
                        <li class="flex items-start gap-2">
                            <i class="fa-solid fa-check text-indigo-500 mt-1.5 flex-shrink-0 text-sm"></i>
                            <span>${item}</span>
                        </li>`)
                    .join('');
            }
        });

        document.querySelectorAll('[data-i18n-aria]').forEach(el => {
            el.setAttribute('aria-label', dict[el.dataset.i18nAria]);
        });

        renderSteps(dict);
        renderPrivacy(dict);

        document.querySelectorAll('.lang-btn').forEach(btn => {
            const on = btn.dataset.lang === locale;
            btn.classList.toggle('active', on);
            btn.setAttribute('aria-pressed', String(on));
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        applyLocale(pickLocale());

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const locale = btn.dataset.lang;
                try {
                    localStorage.setItem(STORAGE_KEY, locale);
                } catch (e) {
                    // 저장이 막혀도 이번 방문 동안은 바뀐 언어로 보여 준다.
                }
                applyLocale(locale);
            });
        });

        // 스크롤 노출 애니메이션
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        setTimeout(() => {
            document.querySelectorAll('header.reveal, section.reveal:first-of-type')
                .forEach(el => el.classList.add('active'));
        }, 50);
    });
</script>
