<!DOCTYPE html>
<!--
  ml-playgrounds 기계학습 프로젝트 시작하기 가이드.

  학생이 실습 환경으로 포트폴리오를 만들기 전에 "무엇을 예측할지 → 어떤 데이터가 필요한지"를
  스스로 정하게 하는 페이지다. 흐름은 소유자 시안과 감사(Fable) 승인을 거쳤다.

  **조용히 낡는 사실을 적지 않는다** - 앱이 지원하는 모델 목록, 화면의 옵션 개수, 탭 이름 같은
  것은 앱이 바뀌면 이 페이지만 틀린 채로 남는다. 개념을 설명하고 옵션은 "예를 들면"으로만 든다.

  문구는 전부 아래 I18N에 있다. 예시 갤러리는 'ex.sup'·'ex.unsup' 배열에 항목을 더하면 칩도 따라온다.
  용어는 ml-playgrounds의 docs/copy.md 용어표를 따른다(타깃·특성·군집, 일본어 目的変数·特徴量 등).
-->
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var root = document.documentElement;
            var theme = null;
            try {
                theme = localStorage.getItem('theme');
            } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            root.dataset.theme = theme;
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" id="meta-description"
          content="How to start a machine learning project: decide what to predict, choose supervised or unsupervised learning, and find the data you need.">
    <meta name="keywords"
          content="기계학습 프로젝트, 머신러닝 포트폴리오, 타깃, 특성, 지도학습, 비지도학습, 회귀, 분류, 군집, 인공지능 기초, machine learning project, education">
    <title>Starting a machine learning project | Machine Learning Playgrounds</title>
    <link rel="icon" href="https://luminousky.com/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="https://luminousky.com/apple-touch-icon.png">

    <link rel="canonical" href="https://luminousky.com/teacher-utility-kit/ml-playgrounds/how-to-create-project/">
    <link rel="alternate" hreflang="ko" href="https://luminousky.com/teacher-utility-kit/ml-playgrounds/how-to-create-project/?lang=ko">
    <link rel="alternate" hreflang="en" href="https://luminousky.com/teacher-utility-kit/ml-playgrounds/how-to-create-project/?lang=en">
    <link rel="alternate" hreflang="ja" href="https://luminousky.com/teacher-utility-kit/ml-playgrounds/how-to-create-project/?lang=ja">
    <link rel="alternate" hreflang="x-default" href="https://luminousky.com/teacher-utility-kit/ml-playgrounds/how-to-create-project/">

    <style>
        :root {
            color-scheme: light;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
        }

        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            letter-spacing: -0.01em;
        }

        body code, body kbd, body samp, body pre {
            font-family: inherit;
        }

        /* 한국어에서만 어절 단위로 끊는다. 영어에 걸면 줄바꿈이 망가진다. */
        html[lang="ko"] body {
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        /* 일본어는 문절 단위로 끊고 일본어 자형 글꼴을 쓴다. 예제 데이터셋 페이지와 같은 스택이다. */
        html[lang="ja"] body {
            font-family: "Pretendard JP Variable", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic",
                Meiryo, "Yu Gothic", "Noto Sans JP", "Noto Sans CJK JP", system-ui, sans-serif;
            word-break: normal;
            word-break: auto-phrase;
            overflow-wrap: break-word;
        }

        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .lang-select option {
            background: #ffffff;
            color: #1e293b;
        }
        [data-theme="dark"] .lang-select option {
            background: #1c1c1e;
            color: #f5f5f7;
        }

        .theme-toggle .icon-sun {
            display: none;
        }
        [data-theme="dark"] .theme-toggle .icon-sun {
            display: inline-block;
        }
        [data-theme="dark"] .theme-toggle .icon-moon {
            display: none;
        }

        /*
          본문 조각. 문구가 I18N 문자열 안에 HTML로 들어 있어, 긴 Tailwind 클래스 줄을
          세 언어에 똑같이 베끼지 않도록 몇 가지 이름만 여기서 정한다.
        */
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 1.75rem;
            box-shadow: 0 1px 2px rgb(0 0 0 / 0.04);
        }
        [data-theme="dark"] .card {
            background: #1c1c1e;
            border-color: #333336;
        }
        .card h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }
        [data-theme="dark"] .card h3 {
            color: #f5f5f7;
        }
        .card p, .card li, .box p, .box li {
            font-size: 1.125rem;
            line-height: 1.75;
            color: #475569;
        }
        [data-theme="dark"] .card p, [data-theme="dark"] .card li,
        [data-theme="dark"] .box p, [data-theme="dark"] .box li {
            color: #d2d2d7;
        }
        .card p + p, .box p + p {
            margin-top: 0.75rem;
        }
        .card ul, .box ul {
            list-style: disc;
            padding-left: 1.25rem;
            margin-top: 0.5rem;
        }
        .card b, .box b {
            color: #1e293b;
        }
        [data-theme="dark"] .card b, [data-theme="dark"] .box b {
            color: #f5f5f7;
        }
        .cards {
            display: grid;
            gap: 1rem;
        }
        @media (min-width: 768px) {
            .cards.two {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .cards.three {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
        .stack > * + * {
            margin-top: 1rem;
        }

        /* 상자: note는 조심할 것, tip은 덧붙이는 안내. */
        .box {
            border-radius: 1rem;
            padding: 1.25rem 1.5rem;
            border: 1px solid;
        }
        .box h3 {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .box.note {
            background: #fffbeb;
            border-color: #fcd34d;
        }
        .box.note h3 {
            color: #92400e;
        }
        [data-theme="dark"] .box.note {
            background: rgb(245 158 11 / 0.1);
            border-color: rgb(245 158 11 / 0.35);
        }
        [data-theme="dark"] .box.note h3 {
            color: #fcd34d;
        }
        .box.tip {
            background: #eef2ff;
            border-color: #c7d2fe;
        }
        .box.tip h3 {
            color: #3730a3;
        }
        [data-theme="dark"] .box.tip {
            background: rgb(99 102 241 / 0.1);
            border-color: rgb(99 102 241 / 0.35);
        }
        [data-theme="dark"] .box.tip h3 {
            color: #a5b4fc;
        }

        /* 타깃과 특성을 글 속에서 구별하는 색. 갤러리와 문장 틀이 같은 색을 쓴다. */
        .hl-t {
            color: #be123c;
            font-weight: 700;
        }
        .hl-f {
            color: #4338ca;
            font-weight: 700;
        }
        [data-theme="dark"] .hl-t {
            color: #fda4af;
        }
        [data-theme="dark"] .hl-f {
            color: #a5b4fc;
        }
        .frame {
            display: block;
            margin: 0.75rem 0;
            padding: 0.875rem 1.125rem;
            border-radius: 0.75rem;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            font-size: 1.125rem;
            line-height: 1.7;
            color: #334155;
        }
        [data-theme="dark"] .frame {
            background: #111113;
            border-color: #48484a;
            color: #e5e5ea;
        }
        .qnum {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 1.75rem;
            height: 1.75rem;
            margin-right: 0.5rem;
            padding: 0 0.5rem;
            border-radius: 9999px;
            background: #4f46e5;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
        }

        /* 유형 탭. 켜진 것만 채운다. 강화학습은 누를 수 없다는 것이 보이게 흐리게 둔다. */
        .mode-tab {
            border: 2px solid #cbd5e1;
            color: #475569;
            background: #ffffff;
        }
        [data-theme="dark"] .mode-tab {
            border-color: #48484a;
            color: #d2d2d7;
            background: #1c1c1e;
        }
        .mode-tab[aria-selected="true"] {
            background: #4f46e5;
            border-color: #4f46e5;
            color: #ffffff;
        }
        .mode-tab[aria-disabled="true"] {
            opacity: 0.45;
            cursor: not-allowed;
        }
        @media (hover: hover) {
            .mode-tab:not([aria-selected="true"]):not([aria-disabled="true"]):hover {
                border-color: #818cf8;
                color: #4f46e5;
            }
        }

        /* 예시 칩. 갤러리 안에서만 붙고 갤러리가 끝나면 함께 올라간다. */
        .ex-chip.active {
            background: #4f46e5;
            border-color: #4f46e5;
            color: #ffffff;
        }
        .chip-rail {
            scrollbar-width: none;
        }
        .chip-rail::-webkit-scrollbar {
            display: none;
        }

        /* 탭 안 h2 옆의 작은 꼬리표. 탭이 화면 밖으로 나가도 지금 어느 쪽을 읽는지 알린다. */
        .mode-tag {
            display: inline-block;
            vertical-align: middle;
            margin-left: 0.5rem;
            padding: 0.125rem 0.625rem;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0;
            background: #eef2ff;
            color: #4338ca;
            border: 1px solid #c7d2fe;
        }
        [data-theme="dark"] .mode-tag {
            background: rgb(99 102 241 / 0.12);
            color: #a5b4fc;
            border-color: rgb(99 102 241 / 0.35);
        }

        .preview-table th, .preview-table td {
            padding: 0.5rem 0.875rem;
            text-align: left;
            white-space: nowrap;
            border-bottom: 1px solid #e2e8f0;
        }
        [data-theme="dark"] .preview-table th, [data-theme="dark"] .preview-table td {
            border-color: #333336;
        }

        /* 예시 카드의 요약 표. 머리칸(주제·타깃·특성)이 왼쪽에 서고 값이 오른쪽에 온다. */
        .ex-summary th {
            width: 6rem;
            padding: 0.75rem 1rem 0.75rem 0;
            text-align: left;
            vertical-align: top;
            font-size: 1rem;
            font-weight: 700;
            color: #64748b;
            white-space: nowrap;
        }
        .ex-summary td {
            padding: 0.75rem 0;
            vertical-align: top;
        }
        .ex-summary tr + tr th, .ex-summary tr + tr td {
            border-top: 1px solid #e2e8f0;
        }
        [data-theme="dark"] .ex-summary th {
            color: #a1a1a6;
        }
        [data-theme="dark"] .ex-summary tr + tr th, [data-theme="dark"] .ex-summary tr + tr td {
            border-color: #333336;
        }
        .ex-pill {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 700;
            border: 1px solid;
        }
        .ex-pill.is-target {
            background: #fff1f2;
            border-color: #fecdd3;
            color: #be123c;
        }
        .ex-pill.is-feature {
            background: #eef2ff;
            border-color: #c7d2fe;
            color: #4338ca;
        }
        [data-theme="dark"] .ex-pill.is-target {
            background: rgb(244 63 94 / 0.12);
            border-color: rgb(244 63 94 / 0.35);
            color: #fda4af;
        }
        [data-theme="dark"] .ex-pill.is-feature {
            background: rgb(99 102 241 / 0.12);
            border-color: rgb(99 102 241 / 0.35);
            color: #a5b4fc;
        }

        .check-list li {
            list-style: none;
            position: relative;
            padding-left: 2rem;
        }
        .check-list li::before {
            content: "☐";
            position: absolute;
            left: 0;
            color: #4f46e5;
            font-weight: 700;
        }
    </style>
    <link rel="stylesheet" href="./tailwind.css">
</head>
<body class="bg-slate-50 dark:bg-black text-slate-700 dark:text-[#f5f5f7] selection:bg-indigo-600 selection:text-white min-h-screen flex flex-col text-base">

<div class="absolute top-4 right-4 z-50 flex items-center gap-2">
    <button type="button" id="theme-toggle" aria-label="Switch to dark mode"
            class="theme-toggle w-[42px] h-[42px] flex items-center justify-center rounded-full border border-slate-300 dark:border-[#48484a] bg-white/90 dark:bg-[#1c1c1e]/90 backdrop-blur-md shadow-xs text-slate-600 dark:text-[#d2d2d7] hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">
        <i class="icon-moon fa-solid fa-moon"></i>
        <i class="icon-sun fa-solid fa-sun"></i>
    </button>
    <div class="relative h-[42px] flex items-center rounded-full border border-slate-300 dark:border-[#48484a] bg-white/90 dark:bg-[#1c1c1e]/90 backdrop-blur-md shadow-xs text-slate-600 dark:text-[#d2d2d7] hover:text-indigo-600 dark:hover:text-indigo-400 focus-within:ring-2 focus-within:ring-indigo-500 transition-colors">
        <i class="fa-solid fa-globe absolute left-3.5 pointer-events-none" aria-hidden="true"></i>
        <select id="lang-select" data-i18n-aria="lang.aria"
                class="lang-select appearance-none h-full bg-transparent pl-10 pr-9 rounded-full text-base font-bold cursor-pointer focus:outline-hidden">
            <option value="en" lang="en">English</option>
            <option value="ko" lang="ko">한국어</option>
            <option value="ja" lang="ja">日本語</option>
        </select>
        <i class="fa-solid fa-chevron-down absolute right-3.5 text-xs pointer-events-none" aria-hidden="true"></i>
    </div>
</div>

<header class="relative py-20 flex flex-col items-center justify-center px-4 text-center reveal bg-white dark:bg-[#0d0d0f] border-b border-slate-200 dark:border-[#333336]">
    <div class="max-w-5xl mx-auto relative z-10 w-full">
        <a href="../"
           class="inline-flex items-center gap-2 mb-6 px-4 py-1.5 rounded-full bg-indigo-50 dark:bg-indigo-500/10 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-500/30 text-base font-bold tracking-tight hover:bg-indigo-100 dark:hover:bg-indigo-500/20 transition-colors">
            <i class="fa-solid fa-arrow-left text-sm"></i>
            Machine Learning Playgrounds
        </a>
        <h1 class="text-4xl md:text-6xl md:leading-none font-bold tracking-tighter mb-6 text-slate-800 dark:text-[#f5f5f7] leading-tight"
            data-i18n="hero.title"></h1>
        <p class="text-xl md:text-2xl md:leading-8 text-slate-500 dark:text-[#a1a1a6] font-medium max-w-3xl mx-auto tracking-tight mb-6 leading-relaxed"
           data-i18n="hero.tagline"></p>
        <p class="text-base text-slate-400 dark:text-[#a1a1a6] max-w-2xl mx-auto mb-10 leading-relaxed" data-i18n="hero.sub"></p>

        <div class="flex flex-wrap items-stretch justify-center gap-4 w-full max-w-2xl mx-auto">
            <a href="#start"
               class="flex-1 basis-64 px-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-bold rounded-xl shadow-xs hover:shadow-md transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-down"></i>
                <span data-i18n="hero.cta.read"></span>
            </a>
            <a href="../datasets/"
               class="flex-1 basis-64 px-8 py-4 bg-slate-800 hover:bg-slate-900 text-white border-2 border-slate-800 hover:border-slate-900 dark:bg-slate-700 dark:hover:bg-slate-600 dark:border-slate-700 dark:hover:border-slate-600 text-lg font-bold rounded-xl shadow-xs hover:shadow-md transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-database"></i>
                <span data-i18n="hero.cta.data"></span>
            </a>
        </div>
    </div>
</header>

<main class="grow px-4 py-16">
    <div class="space-y-24">

        <!-- 1. 무엇이 궁금한가 - 지도·비지도 어느 쪽 학생도 막히지 않게 중립으로 연다. -->
        <section class="reveal max-w-5xl mx-auto" id="start">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-slate-800 dark:text-[#f5f5f7] tracking-tight mb-3" data-i18n="ask.title"></h2>
                <p class="text-xl text-slate-500 dark:text-[#a1a1a6] leading-relaxed" data-i18n="ask.lead"></p>
            </div>
            <div data-i18n="ask.body"></div>
        </section>

        <!-- 2. 유형 판단과 탭. 주제를 정한 다음에 판단한다. 탭은 붙이지 않는다 - 대부분 지도학습이라 자리만 차지한다. -->
        <section class="reveal max-w-5xl mx-auto">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-slate-800 dark:text-[#f5f5f7] tracking-tight mb-3" data-i18n="type.title"></h2>
                <p class="text-xl text-slate-500 dark:text-[#a1a1a6] leading-relaxed" data-i18n="type.lead"></p>
            </div>
            <div data-i18n="type.body"></div>

            <div class="mt-12 -mb-12 flex flex-wrap justify-center gap-3" role="tablist" data-i18n-aria="tab.aria">
                <button type="button" role="tab" id="tab-sup" aria-controls="panel-sup" aria-selected="true"
                        class="mode-tab px-6 py-3 rounded-xl text-lg font-bold transition-colors" data-mode="sup">
                    <i class="fa-solid fa-bullseye mr-1"></i> <span data-i18n="tab.sup"></span>
                </button>
                <button type="button" role="tab" id="tab-unsup" aria-controls="panel-unsup" aria-selected="false" tabindex="-1"
                        class="mode-tab px-6 py-3 rounded-xl text-lg font-bold transition-colors" data-mode="unsup">
                    <i class="fa-solid fa-circle-nodes mr-1"></i> <span data-i18n="tab.unsup"></span>
                </button>
                <button type="button" role="tab" id="tab-rl" aria-selected="false" aria-disabled="true" tabindex="-1"
                        class="mode-tab px-6 py-3 rounded-xl text-lg font-bold">
                    <i class="fa-solid fa-gamepad mr-1"></i> <span data-i18n="tab.rl"></span>
                </button>
            </div>
        </section>

        <!-- 지도학습 -->
        <div id="panel-sup" role="tabpanel" aria-labelledby="tab-sup" class="space-y-24">

            <section class="reveal max-w-5xl mx-auto">
                <div class="text-center mb-10">
                    <h2 class="text-3xl font-bold text-slate-800 dark:text-[#f5f5f7] tracking-tight mb-3"><span data-i18n="s.target.title"></span><span class="mode-tag" data-i18n="tag.sup"></span></h2>
                    <p class="text-xl text-slate-500 dark:text-[#a1a1a6] leading-relaxed" data-i18n="s.target.lead"></p>
                </div>
                <div data-i18n="s.target.body"></div>

                <div class="mt-24" data-gallery="sup">
                    <div class="text-center mb-10">
                        <h2 class="text-3xl font-bold text-slate-800 dark:text-[#f5f5f7] tracking-tight mb-3"><span data-i18n="s.gallery.title"></span><span class="mode-tag" data-i18n="tag.sup"></span></h2>
                        <p class="text-xl text-slate-500 dark:text-[#a1a1a6] leading-relaxed" data-i18n="gallery.lead"></p>
                    </div>
                    <div class="sticky top-3 z-20 pointer-events-none">
                        <div class="chip-rail pointer-events-auto py-1 flex gap-2 overflow-x-auto md:flex-wrap md:justify-center" role="group" data-chips></div>
                    </div>
                    <div class="mt-4" data-example aria-live="polite"></div>
                    <!-- 칩이 풀려 멈추는 자리. sticky는 부모의 padding을 세지 않으므로 빈 칸을 둔다. -->
                    <div class="h-16" aria-hidden="true"></div>
                </div>
            </section>

            <section class="reveal max-w-5xl mx-auto">

        en: {
            'meta.title': 'Starting a machine learning project | Machine Learning Playgrounds',
            'meta.desc': 'How to start a machine learning project: decide what to find out, choose supervised or unsupervised learning, and find the data you need.',
            'lang.aria': 'Select language',
            'hero.title': 'Starting a machine learning project',
            'hero.tagline': 'Decide what you want to know, <br class="hidden sm:block">and the data you need comes into view.',
            'hero.sub': 'Before you build a portfolio in the playground, this guide shows how to decide what to find out <br class="hidden sm:block">and which data to collect.',
            'hero.cta.read': 'Read the guide',
            'hero.cta.data': 'Example datasets',
            'cta.try': 'Open the playground',

            'ask.title': '💡 What do you want to find out?',
            'ask.lead': 'First decide what you want to predict with machine learning.',
            'ask.body': `
                <div class="cards two">
                    <div class="card">
                        <h3><i class="fa-solid fa-circle-check text-emerald-500 mr-1"></i> Problems machine learning can solve</h3>
                        <p>Problems where a model learns patterns from past data and <b>has to answer for cases it has never seen, or find groups people haven't noticed</b>.</p>
                        <ul>
                            <li>Predicting national power demand from the hour, the day of the week and the temperature</li>
                            <li>Grouping customers with similar spending to see what types there are</li>
                        </ul>
                    </div>
                    <div class="card">
                        <h3><i class="fa-solid fa-circle-xmark text-rose-500 mr-1"></i> Problems that don't need machine learning</h3>
                        <p>Problems where a fixed calculation or a lookup <b>gives the answer right away</b>. If people already know the rule, there is nothing for a model to learn.</p>
                        <ul>
                            <li>Finding your next class on the timetable</li>
                            <li>Working out an average grade</li>
                        </ul>
                    </div>
                </div>`,

            'type.title': '🧭 Which type of machine learning problem is it?',
            'type.lead': 'Don\'t pick the type first. Decide what you want to find out, then work out which kind of problem it is.',
            'type.body': `
                <div class="cards two">
                    <div class="card">
                        <h3><i class="fa-solid fa-bullseye text-indigo-500 mr-1"></i> There is one clear value you want to predict</h3>
                        <p>→ That is <b>supervised learning</b>. The value you want to predict is the answer, called the <b>target</b>.</p>
                        <ul>
                            <li>How many shared bikes will be rented in Seoul this hour?</li>
                            <li>Will it rain tomorrow?</li>
                        </ul>
                    </div>
                    <div class="card">
                        <h3><i class="fa-solid fa-circle-nodes text-indigo-500 mr-1"></i> There is nothing to predict; you want to sort similar things into groups</h3>
                        <p>→ That is <b>unsupervised learning</b>. With no answers, the data is split into groups by similarity alone.</p>
                        <ul>
                            <li>What types of spending do wholesale customers show?</li>
                            <li>What groups do earthquakes fall into by location?</li>
                        </ul>
                    </div>
                </div>`,
            'tab.aria': 'Type of machine learning',
            'tab.sup': 'Supervised learning',
            'tab.unsup': 'Unsupervised learning',
            'tab.rl': 'Reinforcement learning',
            'tag.sup': 'Supervised',
            'tag.unsup': 'Unsupervised',
            'gallery.lead': 'Tap a chip to switch examples.',
            'g.sentence': 'Topic',
            'g.target': 'Target',
            'g.features': 'Features',
            'g.preview': 'Example of the data to collect',
            'g.noTarget': 'None — the clusters are the result',
            'g.chips': 'Examples',
            'g.quote': '"%s"',

            's.target.title': '🎯 Choose the target first, then find what affects it',
            's.target.lead': 'A supervised learning project starts by answering two questions.',
            's.target.body': `
                <div class="cards two">
                    <div class="card">
                        <h3><span class="qnum">1</span>What value do you want to predict, that is, what is the <span class="hl-t">target</span>?</h3>
                        <p>The data you collect <b>must have a column for this target</b>. Choose only one target.</p>
                    </div>
                    <div class="card">
                        <h3><span class="qnum">2</span>What does this target depend on?</h3>
                        <p>The values that seem to affect it become <span class="hl-f">features</span>, and each one becomes a column in the table.</p>
                    </div>
                </div>
                <div class="card mt-4">
                    <h3>What do the two questions look like as one sentence?</h3>
                    <span class="frame">"Predict (<span class="hl-t">target</span>) from (<span class="hl-f">features</span>)."</span>
                    <span class="frame">e.g. "Predict <span class="hl-t">the number of bikes rented</span> from <span class="hl-f">the hour, temperature, humidity, rainfall and whether it is a holiday</span>."</span>
                    <span class="frame">e.g. "Predict <span class="hl-t">a child\'s height</span> from <span class="hl-f">the father\'s height, the mother\'s height and sex</span>."</span>
                    <p>That sentence sets the data you need. For the first one, all six columns must be present: <span class="hl-f">hour</span>, <span class="hl-f">temperature</span>, <span class="hl-f">humidity</span>, <span class="hl-f">rainfall</span>, <span class="hl-f">holiday</span> and <span class="hl-t">rentals</span>. This data is in "Seoul Bike Sharing Demand" among the <a class="text-indigo-600 dark:text-indigo-400 font-bold underline" href="../datasets/">example datasets</a>.</p>
                </div>`,
            's.gallery.title': '🗂️ Which columns would other topics need?',

            's.find.title': '🔍 Find data that has every one of those columns',
            's.find.lead': 'Use the names of your target and feature columns as search terms.',
            's.find.body': `
                <div class="cards three">
                    <div class="card">
                        <h3><span class="qnum">1</span>Search open data</h3>
                        <p>Look through the <a class="text-indigo-600 dark:text-indigo-400 font-bold underline" href="../datasets/">example datasets</a> and the dataset search sites listed on that page. Searching for "topic + dataset" or "topic + csv" works well.</p>
                    </div>
                    <div class="card">
                        <h3><span class="qnum">2</span>Collect it yourself</h3>
                        <p>Measure it or run a survey. Agree on the rules before you start: if some people record rentals at the top of the hour and others record the hourly total, the values get mixed up.</p>
                    </div>
                    <div class="card">
                        <h3><span class="qnum">3</span>If only some columns are there</h3>
                        <p>Combine two datasets through a column they share, such as the date or region, or adjust your topic to fit the data you found. Changing the topic is not a step back; it is a normal part of the process.</p>
                    </div>
                </div>`,

            's.task.title': '📐 Look at the target to choose regression or classification',
            's.task.lead': 'Once you have the data, look at what values are in the target column.',
            's.task.body': `
                <div class="cards two">
                    <div class="card">
                        <h3><i class="fa-solid fa-chart-line text-indigo-500 mr-1"></i> Continuous numbers mean regression</h3>
                        <p>You predict <b>a number on a continuous scale</b>, such as rentals, a price or sales.</p>
                    </div>
                    <div class="card">
                        <h3><i class="fa-solid fa-tags text-indigo-500 mr-1"></i> A fixed set of classes means classification</h3>
                        <p>You predict <b>one of a few classes</b>, such as survived or not, or a penguin\'s species.</p>
                    </div>
                </div>
                <div class="card mt-4">
                    <h3>Check before you train</h3>
                    <ul>
                        <li>Even when the values are numbers, it may be <b>classification rather than regression</b>. If the numbers only act as names, like year 1, 2 or 3, it is classification.</li>
                        <li><b>For classification, does each class have a similar number of rows?</b> If one class is far larger, a model can score highly just by always answering that class.</li>
                        <li><b>For regression, are the values spread evenly?</b> If you only collected rentals in summer, the model never learns what winter looks like.</li>
                    </ul>
                </div>
                <div class="box tip mt-4">
                    <h3><i class="fa-solid fa-camera mr-1"></i> If you want to use images</h3>
                    <p>Image classification follows the same steps. <b>Each image plays the role of the features</b>, and <b>the name of the folder it sits in is the target (its class)</b>. That is why projects with photos are mostly classification problems too.</p>
                    <ul>
                        <li>The check just above applies to images too: each class should have a similar number of photos.</li>
                        <li>When you look for data, read "a table with every column" as "photos collected for each class".</li>
                        <li>Table clean-up such as missing values and encoding doesn't apply to photos. Every other step is the same.</li>
                    </ul>
                </div>`,

            's.split.title': '✂️ Set aside test data',
            's.split.lead': 'Grading a model on the data it trained on is like taking an exam made of questions you have already memorized. So evaluate the model on data that was not used for training.',
            's.split.body': `
                <div class="card">
                    <p>Set aside part of the available data (for example, 20%) as <b>test data</b>. Test data is not used for training; it is used only to evaluate the trained model. The model learns from the rest, the <b>training data</b>.</p>
                    <p>With too little test data the score swings by chance; with too much, there is not enough left to learn from.</p>
                </div>`,

            's.prep.title': '🧹 Clean up the data',
            's.prep.lead': 'A model can\'t calculate with blank cells and text as they are. So the data has to be preprocessed before training.',
            's.prep.body': `
                <div class="cards three">
                    <div class="card">
                        <h3>Missing values</h3>
                        <p>These are empty cells. Either delete those rows, or fill them with a typical value such as the mean, median or mode.</p>
                        <p>Deleting leaves less data; filling means inventing values that weren't there. Decide based on how many are missing.</p>
                    </div>
                    <div class="card">
                        <h3>Scaling</h3>
                        <p>When columns differ hugely in size (temperatures in the tens, populations in the hundreds of thousands), the column with bigger numbers can dominate the result.</p>
                        <p>Bring the columns into a similar range. Standardization and normalization are two examples.</p>
                    </div>
                    <div class="card">
                        <h3>Categorical encoding</h3>
                        <p>Turns text values such as "sunny, cloudy, rainy" into numbers.</p>
                        <p>One-hot encoding suits values with no order; ordinal encoding suits values with an order, such as "low, medium, high".</p>
                    </div>
                </div>`,

            's.model.title': '🧠 Choose a model and tune its hyperparameters',
            's.model.lead': 'Don\'t stop at one model. Try several and compare them.',
            's.model.body': `
                <div class="cards two">
                    <div class="card">
                        <h3>Models</h3>
                        <p>Even on the same data, each model finds patterns in its own way. For example, k-nearest neighbors answers by looking at the few most similar rows, while a decision tree splits the data through a chain of questions.</p>
                    </div>
                    <div class="card">
                        <h3>Hyperparameters</h3>
                        <p>Settings that a person chooses before training, such as the number of neighbors in k-nearest neighbors.</p>
                        <p><b>Change only one at a time.</b> That way you know what caused the result to change.</p>
                    </div>
                </div>`,

            's.result.title': '📊 Read the results',
            's.result.lead': 'After training the model, check the scores calculated on the test data. Regression and classification use different scores.',
            's.result.body': `
                <div class="cards two">
                    <div class="card">
                        <h3><i class="fa-solid fa-chart-line text-indigo-500 mr-1"></i> Regression</h3>
                        <ul>
                            <li><b>Coefficient of determination (R²)</b>: the closer to 1, the better it explains changes in the target. Near 0 is about as good as always answering the average.</li>
                            <li><b>Root mean squared error</b>: how far off the predictions are on average, with big misses weighted more heavily.</li>
                            <li><b>Mean absolute error</b>: the average size of the misses, read directly in the target\'s units, as in "off by 30 bikes on average".</li>
                        </ul>
                    </div>
                    <div class="card">
                        <h3><i class="fa-solid fa-tags text-indigo-500 mr-1"></i> Classification</h3>
                        <p>Take a model that predicts whether a credit card transaction is fraud (normal or fraud). With three or more classes, precision and recall are calculated for each class separately.</p>
                        <ul>
                            <li><b>Confusion matrix</b>: a table that crosses actual classes with predicted classes, showing where the model goes wrong.</li>
                            <li><b>Accuracy</b>: the share of all predictions that were right.</li>
                            <li><b>Precision</b>: of the transactions it flagged as "fraud", the share that really were fraud.</li>
                            <li><b>Recall</b>: of the real fraud transactions, the share the model flagged as "fraud".</li>
                        </ul>
                    </div>
                </div>
                <div class="box note mt-4">
                    <h3><i class="fa-solid fa-triangle-exclamation mr-1"></i> Accuracy alone can fool you</h3>
                    <p>If only 1 transaction in 100 is fraud, a model that always answers "normal" gets 99% accuracy. But its recall is 0, because it never catches a single fraud. The "Credit Card Fraud" example dataset is exactly this kind of data.</p>
                </div>
                <div class="box tip mt-4">
                    <p>The results screen may show other metrics as well. Decide what score counts as success <b>before you start training</b>. If you decide afterwards, you'll end up calling whatever you got a success.</p>
                </div>`,

            'u.target.title': '🧩 There is no target; the clusters are the result',
            'u.target.lead': 'An unsupervised learning project has no answer column to predict.',
            'u.target.body': `
                <div class="cards two">
                    <div class="card">
                        <h3>Every column is a feature</h3>
                        <p>Every column you use for training is a <span class="hl-f">feature</span>. The model groups rows with similar feature values into <b>clusters</b>, and those clusters take the place of the target in supervised learning.</p>
                    </div>
                    <div class="card">
                        <h3>When is it used?</h3>
                        <p>When there is no answer, but you want to group similar things and look at <b>the tendencies of each group</b>. Models like this are called clustering models; k-means is a well-known example.</p>
                    </div>
                </div>
                <div class="card mt-4">
                    <h3>Write what you want to find out in one sentence</h3>
                    <span class="frame">"Group (things) with similar (<span class="hl-f">features</span>)."</span>
                    <span class="frame">"Group customers with similar <span class="hl-f">spending on fresh food, milk, groceries and frozen food</span>."</span>
                    <p>For this sentence, four columns are enough: <span class="hl-f">fresh</span>, <span class="hl-f">milk</span>, <span class="hl-f">grocery</span> and <span class="hl-f">frozen</span>. This data is in "Wholesale Customers" among the example datasets.</p>
                </div>
                <div class="box tip mt-4">
                    <p>Unsupervised learning doesn't set aside test data, because there are no answers to grade against.</p>
                </div>`,
            'u.gallery.title': '🗂️ Topics you could group',

            'u.find.title': '🔍 Find data with the columns you want to group by',
            'u.find.lead': 'Which features you group by decides the result.',
            'u.find.body': `
                <div class="cards two">
                    <div class="card">
                        <h3>Keep only the columns for grouping</h3>
                        <p>Columns added just to tell rows apart, such as names or student numbers, have nothing to do with similarity, so leave them out.</p>
                        <p>Columns that look like answers, such as an existing homeroom or a species name, can be left out of training and used later to compare against the clusters.</p>
                    </div>
                    <div class="card">
                        <h3>Search the same way</h3>
                        <p>Look in the <a class="text-indigo-600 dark:text-indigo-400 font-bold underline" href="../datasets/">example datasets</a> and dataset search sites, or collect data yourself by measuring or surveying. Record the source and download date in the same way.</p>
                    </div>
                </div>`,

            'u.prep.title': '🧹 Clean up the data',
            'u.prep.lead': 'Clustering often measures similarity as the distance between values.',
            'u.prep.body': `
                <div class="cards two">
                    <div class="card">
                        <h3>Scaling matters most</h3>
                        <p>If you put in depth (hundreds of km) and magnitude (4 to 9) as they are, the larger depth numbers decide almost all of the distance. Bring the columns into a similar range.</p>
                    </div>
                    <div class="card">
                        <h3>Missing values and categorical encoding</h3>
                        <p>Handle them for the same reasons as in supervised learning: delete or fill blanks, and turn text values into numbers.</p>
                    </div>
                </div>`,

            'u.model.title': '⚙️ Try different numbers of clusters and compare',
            'u.model.lead': 'In many models, such as k-means, a person decides the number of clusters.',
            'u.model.body': `
                <div class="card">
                    <p>Try 2, 3 and 4 clusters, and look for the number at which each cluster has clear features of its own.</p>
                    <p>If a cluster appears that isn't distinct from the others, you may have too many clusters.</p>
                </div>`,

            'u.result.title': '📊 Name the clusters',
            'u.result.lead': 'The model only numbers the clusters. Giving them meaning is up to you.',
            'u.result.body': `
                <div class="card">
                    <p>Look at the average feature values of each cluster and give it a name, such as "restaurant-type customers who spend a lot on fresh food". That interpretation is the result of your project.</p>
                </div>
                <div class="box tip mt-4">
                    <p>The results screen may also show metrics for how well the clusters are separated.</p>
                </div>`,

            'end.title': '📝 Sum it up on one page before you start',
            'end.lead': 'If you can fill in every item below, you are ready to open the playground.',

                  features: ['緯度', '経度', '震源の深さ(km)', 'マグニチュード'],

                  features: ['HP', 'こうげき', 'ぼうぎょ', 'すばやさ'],
                  rows: [['45', '49', '49', '45'], ['106', '110', '90', '130']] },
                { chip: '自動車の性能', sentence: '<span class="hl-f">気筒数・排気量・馬力・重量</span>が似ている自動車どうしでクラスタを作る',
                  features: ['気筒数', '排気量(立方インチ)', '馬力', '重量(ポンド)'],
                  rows: [['8', '307', '130', '3504'], ['4', '97', '88', '2130']] },
                { chip: 'アヤメ', sentence: '<span class="hl-f">がく片の長さ・がく片の幅・花びらの長さ・花びらの幅</span>が似ているアヤメどうしでクラスタを作る',
                  features: ['がく片の長さ(cm)', 'がく片の幅(cm)', '花びらの長さ(cm)', '花びらの幅(cm)'],
                  rows: [['5.1', '3.5', '1.4', '0.2'], ['7.0', '3.2', '4.7', '1.4']] }
            ]
        }
    };

    const SUPPORTED = ['ko', 'en', 'ja'];
    const FALLBACK = 'en';
    // 예제 데이터셋 페이지와 같은 키다. 한 페이지에서 고른 언어가 다른 페이지에서도 이어진다.
    const STORAGE_KEY = 'mlp-landing-lang';
    let currentLocale = FALLBACK;
    // 고른 예시는 언어를 바꿔도 그대로 둔다. 칩 이름이 바뀌어도 같은 자리의 예시다.
    const picked = { sup: 0, unsup: 0 };

    function pickLocale() {
        const fromQuery = new URLSearchParams(location.search).get('lang');
        if (SUPPORTED.includes(fromQuery)) return fromQuery;

        let stored = null;
        try {
            stored = localStorage.getItem(STORAGE_KEY);
        } catch (e) {}
        if (SUPPORTED.includes(stored)) return stored;

        const preferred = navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || FALLBACK];
        for (const tag of preferred) {
            const base = String(tag).toLowerCase().split('-')[0];
            if (SUPPORTED.includes(base)) return base;
        }
        return FALLBACK;
    }

    function loadLocaleFont(locale) {
        if (window.localeFonts) window.localeFonts[locale]?.();
        else window.pendingLocaleFont = locale;
    }

    function renderExample(kind, dict) {
        const root = document.querySelector(`[data-gallery="${kind}"]`);
        const list = dict[`ex.${kind}`];
        const ex = list[picked[kind]];
        const hasTarget = kind === 'sup';
        const head = hasTarget ? [...ex.features, ex.target] : ex.features;

        root.querySelector('[data-chips]').setAttribute('aria-label', dict['g.chips']);
        root.querySelector('[data-chips]').innerHTML = list.map((item, i) => `
            <button type="button" data-index="${i}" aria-pressed="${i === picked[kind]}"
                    class="ex-chip ${i === picked[kind] ? 'active' : ''} shrink-0 px-4 py-2 rounded-full shadow-sm border border-slate-300 dark:border-[#48484a] bg-white dark:bg-[#1c1c1e] text-base font-bold text-slate-600 dark:text-[#d2d2d7] hover:border-indigo-400 transition-colors">${item.chip}</button>`)
            .join('');

        const th = head.map((name, i) => {
            const isTarget = hasTarget && i === head.length - 1;
            return `<th class="${isTarget ? 'hl-t' : 'hl-f'}">${name}</th>`;
        }).join('');
        const rows = ex.rows.map(r => `<tr>${r.map(v => `<td class="text-slate-600 dark:text-[#d2d2d7]">${v}</td>`).join('')}</tr>`).join('')
            + `<tr>${head.map(() => '<td class="text-slate-400 dark:text-[#6e6e73]">…</td>').join('')}</tr>`;

        // 위계: 주제 한 문장 → 그 문장에서 나온 타깃·특성 → 그래서 수집할 데이터. 앞의 셋은 머리칸이 있는
        // 표 하나로 묶어 같은 층임을 보이고, 데이터 예시는 제목을 따로 단 아래 층으로 둔다.
        const pill = (name, cls) => `<span class="ex-pill ${cls}">${name}</span>`;
        root.querySelector('[data-example]').innerHTML = `
            <div class="card">
                <table class="ex-summary w-full">
                    <tbody>
                        <tr>
                            <th scope="row">${dict['g.sentence']}</th>
                            <td class="text-lg font-bold text-slate-800 dark:text-[#f5f5f7]">${dict['g.quote'].replace('%s', ex.sentence)}</td>
                        </tr>
                        <tr>
                            <th scope="row">${dict['g.target']}</th>
                            <td>${hasTarget ? pill(ex.target, 'is-target') : `<span class="text-slate-500 dark:text-[#a1a1a6]">${dict['g.noTarget']}</span>`}</td>
                        </tr>
                        <tr>
                            <th scope="row">${dict['g.features']}</th>
                            <td><div class="flex flex-wrap gap-2">${ex.features.map(f => pill(f, 'is-feature')).join('')}</div></td>
                        </tr>
                    </tbody>
                </table>
                <h4 class="mt-6 mb-2 text-base font-bold text-slate-800 dark:text-[#f5f5f7]"><i class="fa-solid fa-table text-indigo-500 mr-1"></i> ${dict['g.preview']}</h4>
                <div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-[#333336]">
                    <table class="preview-table w-full text-base">
                        <thead class="bg-slate-50 dark:bg-[#111113]"><tr>${th}</tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            </div>`;
    }

    function applyLocale(locale) {
        const dict = I18N[locale] || I18N[FALLBACK];
        currentLocale = SUPPORTED.includes(locale) ? locale : FALLBACK;

        loadLocaleFont(currentLocale);
        document.documentElement.lang = currentLocale;
        document.title = dict['meta.title'];
        document.getElementById('meta-description').setAttribute('content', dict['meta.desc']);

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const value = dict[el.dataset.i18n];
            if (typeof value === 'string') el.innerHTML = value;
        });
        document.querySelectorAll('[data-i18n-aria]').forEach(el => {
            el.setAttribute('aria-label', dict[el.dataset.i18nAria]);
        });

        document.getElementById('end-list').innerHTML = dict['end.list'].map(item => `<li>${item}</li>`).join('');
        renderExample('sup', dict);
        renderExample('unsup', dict);

        document.getElementById('lang-select').value = currentLocale;
    }

    // 유형 탭. 강화학습은 aria-disabled라 포커스는 받되 눌러도 아무 일이 없다.
    function initModeTabs() {
        const tabs = [...document.querySelectorAll('.mode-tab[data-mode]')];
        const select = (mode, focus) => {
            tabs.forEach(tab => {
                const on = tab.dataset.mode === mode;
                tab.setAttribute('aria-selected', String(on));
                tab.tabIndex = on ? 0 : -1;
                document.getElementById(tab.getAttribute('aria-controls')).hidden = !on;
                if (on && focus) tab.focus();
            });
            // 막 드러난 패널의 섹션은 관찰자가 아직 보지 못했다. 화면에 들어올 때 켜지도록 둔다.
        };
        tabs.forEach(tab => {
            tab.addEventListener('click', () => select(tab.dataset.mode, false));
            tab.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                event.preventDefault();
                const i = tabs.indexOf(tab);
                const next = tabs[(i + (event.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
                select(next.dataset.mode, true);
            });
        });
    }

    function initGalleries() {
        document.querySelectorAll('[data-gallery]').forEach(root => {
            root.querySelector('[data-chips]').addEventListener('click', event => {
                const chip = event.target.closest('button[data-index]');
                if (!chip) return;
                const kind = root.dataset.gallery;
                picked[kind] = Number(chip.dataset.index);
                renderExample(kind, I18N[currentLocale] || I18N[FALLBACK]);
            });
        });
    }

    function initThemeToggle() {
        const root = document.documentElement;
        const toggle = document.getElementById('theme-toggle');
        const syncLabel = () => {
            toggle.setAttribute('aria-label', root.dataset.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
        };
        syncLabel();
        toggle.addEventListener('click', () => {
            root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
            try {
                localStorage.setItem('theme', root.dataset.theme);
            } catch (e) {}
            syncLabel();
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        initThemeToggle();
        initModeTabs();
        initGalleries();
        applyLocale(pickLocale());

        document.getElementById('lang-select').addEventListener('change', event => {
            const locale = event.target.value;
            try {
                localStorage.setItem(STORAGE_KEY, locale);
            } catch (e) {}
            applyLocale(locale);
        });

        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        setTimeout(() => {
            document.querySelectorAll('header.reveal, #start').forEach(el => el.classList.add('active'));
        }, 50);
    });
</script>

<script type="module">

</script>
