<!DOCTYPE html>
<!--
  ml-playgrounds 예제 데이터셋 목록.

  카드를 HTML에 직접 쓰지 않는다. 아래 DATASETS 배열에 항목을 하나 더하면
  카드도, 필터 칩도, 개수도 전부 따라 움직인다.

  파일 자체는 이 저장소에 두지 않는다 - RELEASE_BASE가 가리키는
  GitHub 릴리스 자산에서 내려받는다.
-->
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var root = document.documentElement;
            var theme = null;
            try {
                theme = localStorage.getItem('theme');
            } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            root.dataset.theme = theme;
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" id="meta-description"
          content="Ready-to-use example datasets for Machine Learning Playgrounds — tables and images for classification, regression, and clustering practice.">
    <meta name="keywords"
          content="머신러닝 데이터셋, 예제 데이터, 실습 데이터, 붓꽃, MNIST, 분류, 회귀, 군집, 인공지능 기초, machine learning datasets, sample data, education">
    <title>Example datasets | Machine Learning Playgrounds</title>
    <link rel="icon" href="https://luminousky.com/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="https://luminousky.com/apple-touch-icon.png">

    <link rel="canonical" href="https://luminousky.com/teacher-utility-kit/ml-playgrounds/datasets/">
    <link rel="alternate" hreflang="ko" href="https://luminousky.com/teacher-utility-kit/ml-playgrounds/datasets/?lang=ko">
    <link rel="alternate" hreflang="en" href="https://luminousky.com/teacher-utility-kit/ml-playgrounds/datasets/?lang=en">
    <link rel="alternate" hreflang="ja" href="https://luminousky.com/teacher-utility-kit/ml-playgrounds/datasets/?lang=ja">
    <link rel="alternate" hreflang="x-default" href="https://luminousky.com/teacher-utility-kit/ml-playgrounds/datasets/">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ['selector', '[data-theme="dark"]']
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");

        :root {
            color-scheme: light;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
        }

        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            letter-spacing: -0.01em;
        }

        /*
          Tailwind preflight가 code·kbd·samp·pre를 mono로 돌려놓는다. 이 페이지에는
          글꼴이 하나뿐이라 그 자리만 얼굴이 달라진다 - 열 이름과 확장자는 본문 속
          낱말이지 코드 블록이 아니다. body에서 물려받게 되돌린다.
        */
        body code, body kbd, body samp, body pre {
            font-family: inherit;
        }

        /* 한국어에서만 어절 단위로 끊는다. 영어에 걸면 줄바꿈이 망가진다. */
        html[lang="ko"] body {
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        /*
          일본어는 띄어쓰기가 없어 keep-all을 걸면 문장 전체가 한 덩어리가 된다.
          문절 단위(auto-phrase)로 끊고, 그것을 모르는 브라우저는 글자 단위(normal)로 둔다.

          **글꼴도 갈아 끼운다** - Pretendard의 한자는 한국식 자형이라 일본어 화면의
          直·骨 같은 글자가 달라 보인다. Pretendard JP는 일본어를 고를 때만 싣는다
          (아래 loadLocaleFont). 뒤의 OS 글꼴은 그것이 오기 전과 못 받았을 때 그린다.
          앱(ml-playgrounds의 base.css)과 같은 스택이다.
        */
        html[lang="ja"] body {
            font-family: "Pretendard JP Variable", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic",
                Meiryo, "Yu Gothic", "Noto Sans JP", "Noto Sans CJK JP", system-ui, sans-serif;
            word-break: normal;
            word-break: auto-phrase;
            overflow-wrap: break-word;
        }

        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /*
          언어 선택의 펼친 목록. 목록은 브라우저가 그리는데, 색을 select에서 물려받으면
          투명 바탕 위의 옅은 글자가 되어 다크 모드에서 읽히지 않는다. 판을 직접 칠한다.
        */
        .lang-select option {
            background: #ffffff;
            color: #1e293b;
        }
        [data-theme="dark"] .lang-select option {
            background: #1c1c1e;
            color: #f5f5f7;
        }

        /* 필터 칩 - 켜진 것만 채운다. */
        .filter-chip.active,
        .filter-chip.active:hover {
            background: #4f46e5;
            border-color: #4f46e5;
            color: #ffffff;
        }

        .filter-chip.active:hover {
            background: #4338ca;
            border-color: #4338ca;
        }

        /* Theme toggle: show the icon of the theme you would switch to */
        .theme-toggle .icon-sun {
            display: none;
        }
        [data-theme="dark"] .theme-toggle .icon-sun {
            display: inline-block;
        }
        [data-theme="dark"] .theme-toggle .icon-moon {
            display: none;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-black text-slate-700 dark:text-[#f5f5f7] selection:bg-indigo-600 selection:text-white min-h-screen flex flex-col text-base">

<!--
  테마 스위치와 언어 선택.
  **언어는 나란한 단추가 아니라 펼침 목록이다** - 단추를 늘어놓으면 언어가 하나 늘 때마다
  오른쪽 위의 띠가 길어져 좁은 화면에서 히어로 제목을 덮는다. 목록은 몇 개가 되든
  지금 언어 하나만큼의 폭이다. 앱의 상태 표시줄도 같은 이유로 select를 쓴다.
  **언어 이름은 그 언어로 적는다** - 읽을 수 없는 화면에 들어온 사람이 자기 말을 찾는 자리다.
-->
<div class="fixed top-4 right-4 z-50 flex items-center gap-2">
    <button type="button" id="theme-toggle" aria-label="Switch to dark mode"
            class="theme-toggle w-[42px] h-[42px] flex items-center justify-center rounded-full border border-slate-300 dark:border-[#48484a] bg-white/90 dark:bg-[#1c1c1e]/90 backdrop-blur-md shadow-sm text-slate-600 dark:text-[#d2d2d7] hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">
        <i class="icon-moon fa-solid fa-moon"></i>
        <i class="icon-sun fa-solid fa-sun"></i>
    </button>
    <div class="relative h-[42px] flex items-center rounded-full border border-slate-300 dark:border-[#48484a] bg-white/90 dark:bg-[#1c1c1e]/90 backdrop-blur-md shadow-sm text-slate-600 dark:text-[#d2d2d7] hover:text-indigo-600 dark:hover:text-indigo-400 focus-within:ring-2 focus-within:ring-indigo-500 transition-colors">
        <i class="fa-solid fa-globe absolute left-3.5 pointer-events-none" aria-hidden="true"></i>
        <select id="lang-select" data-i18n-aria="lang.aria"
                class="lang-select appearance-none h-full bg-transparent pl-10 pr-9 rounded-full text-base font-bold cursor-pointer focus:outline-none">
            <option value="en" lang="en">English</option>
            <option value="ko" lang="ko">한국어</option>
            <option value="ja" lang="ja">日本語</option>
        </select>
        <i class="fa-solid fa-chevron-down absolute right-3.5 text-xs pointer-events-none" aria-hidden="true"></i>
    </div>
</div>

<!-- Header -->
<header class="relative py-20 flex flex-col items-center justify-center px-4 text-center reveal bg-white dark:bg-[#0d0d0f] border-b border-slate-200 dark:border-[#333336]">

        <a href="../"

                <span data-i18n="hero.cta.try"></span>

            <a href="#datasets"

<!--
  글 영역의 폭은 소개 페이지와 같은 max-w-5xl이다. 두 페이지가 같은 폭이라 오가도
  글줄이 흔들리지 않고, 더 넓히면 한 줄이 길어져 읽기 어렵다.
  **목록만 max-w-7xl이다** - 2열 카드는 글줄이 아니라 칸이라 넓어도 읽기가 무너지지
  않고, 카드 하나가 좁으면 통계 숫자와 출처 줄이 먼저 꺾인다.
  오른쪽 위 고정 컨트롤(약 180px)은 5xl에서도 1450px 아래 화면이면 이미 목록과
  겹친다. 7xl로 넓혀 새로 겹치는 폭은 1450~1710px 구간뿐이다.
-->
<main class="flex-grow px-4 py-16">
    <div class="space-y-24">

        <!-- 목록 -->
        <section class="reveal max-w-7xl mx-auto" id="datasets">

                <h2 class="text-3xl font-bold text-slate-800 dark:text-[#f5f5f7] tracking-tight mb-3" data-i18n="list.title"></h2>
                <p class="text-xl text-slate-500 dark:text-[#a1a1a6]" data-i18n="list.lead"></p>
            </div>

            <!--
              찾기와 거르기. 두 갈래로 나눈다 - 무슨 파일인가, 무슨 모델을 붙일 수 있는가.
              칩도 카드도 DATASETS에서 나오므로 여기에는 빈 그릇만 둔다.
            -->
            <div class="bg-white dark:bg-[#1c1c1e] rounded-3xl border border-slate-200 dark:border-[#333336] shadow-lg p-6 md:p-8 mb-10 space-y-5">
                <div class="flex flex-col sm:flex-row sm:items-center gap-3">
                    <span class="shrink-0 sm:w-40 text-base font-bold text-slate-800 dark:text-[#f5f5f7]" data-i18n="filter.search"></span>
                    <div class="relative flex-1 w-full">

                        <input type="search" id="search-input" autocomplete="off"
                               data-i18n-placeholder="filter.search.placeholder"
                               data-i18n-aria="filter.search"
                               class="w-full pl-11 pr-4 py-2.5 rounded-full border border-slate-300 dark:border-[#48484a] bg-white dark:bg-[#1c1c1e]
                                      text-base text-slate-700 dark:text-[#f5f5f7] placeholder:text-slate-400 dark:placeholder:text-[#86868b]
                                      focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 dark:focus:ring-indigo-500/30 transition-colors">
                    </div>
                </div>
                <div class="flex flex-col sm:flex-row sm:items-center gap-3 pt-5 border-t border-slate-200 dark:border-[#333336]">
                    <span class="shrink-0 sm:w-40 text-base font-bold text-slate-800 dark:text-[#f5f5f7]" data-i18n="filter.format"></span>
                    <div class="flex flex-wrap gap-2" id="filter-format"></div>
                </div>
                <div class="flex flex-col sm:flex-row sm:items-center gap-3 pt-5 border-t border-slate-200 dark:border-[#333336]">
                    <span class="shrink-0 sm:w-40 text-base font-bold text-slate-800 dark:text-[#f5f5f7]" data-i18n="filter.task"></span>
                    <div class="flex flex-wrap gap-2" id="filter-task"></div>
                </div>
                <div class="flex flex-col sm:flex-row sm:items-center gap-3 pt-5 border-t border-slate-200 dark:border-[#333336]">
                    <span class="shrink-0 sm:w-40 text-base font-bold text-slate-800 dark:text-[#f5f5f7]" data-i18n="filter.topic"></span>
                    <div class="flex flex-wrap gap-2" id="filter-topic"></div>
                </div>
            </div>

            <p class="mb-6 text-center text-base text-slate-400 dark:text-[#a1a1a6]" id="result-count"></p>

            <!--
              두 열까지만 편다. 세 열로 가면 카드가 좁아져 요약과 통계가 잘게 끊기고,
              카드마다 담긴 것이 많아 오히려 읽기 어려워진다.
            -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 lg:gap-6" id="dataset-grid"></div>

            <p class="hidden text-center py-20 text-lg text-slate-400 dark:text-[#a1a1a6]" id="empty-state" data-i18n="list.empty"></p>
        </section>

        <!-- 사용법 -->
        <section class="reveal max-w-5xl mx-auto">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-slate-800 dark:text-[#f5f5f7] tracking-tight mb-3" data-i18n="how.title"></h2>
                <p class="text-xl text-slate-500 dark:text-[#a1a1a6] leading-relaxed" data-i18n="how.lead"></p>
            </div>

            <div class="bg-white dark:bg-[#1c1c1e] rounded-3xl border border-slate-200 dark:border-[#333336] shadow-lg p-8 md:p-10">

            <p class="mt-6 text-center text-base text-slate-400 dark:text-[#a1a1a6]" data-i18n="how.note"></p>
        </section>

        <!-- 출처와 라이선스 -->
        <section class="reveal max-w-5xl mx-auto">

                    <p class="text-slate-600 dark:text-[#d2d2d7] text-lg leading-relaxed" data-i18n="credit.origin.body"></p>
                </div>

                <div class="bg-white dark:bg-[#1c1c1e] rounded-3xl border border-slate-200 dark:border-[#333336] shadow-lg p-8">
                    <div class="w-14 h-14 bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-400 rounded-xl flex items-center justify-center text-2xl mb-6">

                    </div>

        <!-- 마무리 -->

    </div>
</main>

<script>
    // =====================================================================
    // 1. 배포처
    //
    // 파일은 저장소가 아니라 ml-playgrounds의 고정 태그 릴리스에 붙어 있다.
    // **태그는 datasets 하나로 고정한다** - 태그를 올릴 때마다 이 페이지를 고쳐야

            'credit.header.body': '元の列名は英語です。日本語版のファイルはまだないため、このページを日本語で表示していても英語版のファイルがダウンロードされます。英語版では列名を原文のまま使っています。値については、<code class="text-indigo-600 dark:text-indigo-400 font-bold">unacc</code>や地域コードの<code class="text-indigo-600 dark:text-indigo-400 font-bold">1</code>のように、それだけでは意味が伝わらないものに限って、<code class="text-indigo-600 dark:text-indigo-400 font-bold">Unacceptable (unacc)</code>のように英語で言い換え、原文を括弧内に残しています。',
            'credit.note': 'ライセンスは、配布元が表示している内容をそのまま記載しています。再配布の条件が重要な用途では、配布元で直接確認してください。',

            'end.title': 'データを選んだら',
            'end.lead': '実習環境を開いて、ファイルを読み込んでください。インストールも登録も不要です。',

            'footer.app': '実習環境を開く',
            'footer.intro': '紹介ページ',
            'footer.github': 'GitHubリポジトリ',
            'footer.privacy': 'プライバシーポリシー',
            'footer.home': '← Teacher Utility Kitのホームに戻る'
        }
    };

    const SUPPORTED = ['ko', 'en', 'ja'];
    // 주소·저장값·브라우저 언어 어느 것도 지원 언어가 아닐 때. 앱과 규정 문서도 영어로 떨어진다.
    const FALLBACK = 'en';
    const STORAGE_KEY = 'mlp-landing-lang';

    // 지금 켜져 있는 필터. null이면 그 갈래는 전부 통과시킨다.
    let currentLocale = FALLBACK;
    let activeFormat = null;
    let activeTask = null;
    let activeTopic = null;
    let query = '';

    // 검색어를 한 글자마다 처리하지 않는다. 마지막 입력에서 이만큼 쉬면 그때 그린다.
    const SEARCH_DEBOUNCE_MS = 100;

    function pickLocale() {
        const fromQuery = new URLSearchParams(location.search).get('lang');
        if (SUPPORTED.includes(fromQuery)) return fromQuery;

        let stored = null;
        try {
            stored = localStorage.getItem(STORAGE_KEY);
        } catch (e) {
            // 사생활 보호 모드 등에서 접근이 막히면 그냥 브라우저 언어를 본다.
        }
        if (SUPPORTED.includes(stored)) return stored;

        const preferred = navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || FALLBACK];
        for (const tag of preferred) {
            const base = String(tag).toLowerCase().split('-')[0];
            if (SUPPORTED.includes(base)) return base;
        }
        return FALLBACK;
    }

    // 그 언어를 고를 때만 더 싣는 글꼴. 한국어·영어 화면은 받지 않는다.
    // 화면에 뜬 글자 범위의 파일만 받는 dynamic subset이다.
    const LOCALE_FONTS = {
        ja: 'https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css'
    };

    function loadLocaleFont(locale) {
        const href = LOCALE_FONTS[locale];
        if (!href || document.querySelector(`link[href="${href}"]`)) return;
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        document.head.appendChild(link);
    }

    // 한국어 병기본과 원본이 갈리는 자리. 문자열 하나면 언어 공통 파일이다.
    // **제 언어의 파일이 없으면 영어 원본이다** - 일본어 병기본은 아직 없다. 한국어로
    // 떨어뜨리면 읽을 수 없는 병기가 붙은 파일을 받는다. 원본은 어느 언어에서나 읽힌다.
    // 병기본이 생기면 assets에 { ja: 'iris.ja.zip' }을 더하는 것으로 끝난다.
    function assetUrl(dataset, locale) {
        const assets = dataset.assets;
        const file = typeof assets === 'string' ? assets : (assets[locale] || assets.en);
        return RELEASE_BASE + file;
    }

    // 칩에 적는 열 이름은 **받은 파일 안의 열 이름**을 따른다. 그래서 assetUrl과 같은 길로
    // 떨어진다 - 한국어 병기본을 받는 한국어만 한국어 이름이고, 나머지는 원본 이름이다.
    // 칩에는 짧은 이름(병기 괄호 앞)만, 펼치면 머리글 그대로를 보여 준다.
    function columnName(col, locale) {
        return locale === 'ko' ? col[0] : col[1];
    }

    function columnShort(col, locale) {
        return locale === 'ko' ? col[0].replace(/ \([^()]*\)$/, '') : col[1];
    }

    function escapeHtml(text) {
        return text.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
    }

    // **타깃·빼기 두 줄의 칩.** 칩을 누르면 그 아래 한 칸에 정확한 열 이름과 이유가 펼쳐진다.
    // 이유를 카드에 늘 적어 두면 카드가 길어져서 접어 둔다. '누르면 펼쳐진다'는 안내도
    // 카드마다 적지 않는다 - 칩 끝의 ⓘ와 사용법 절 한 줄이 맡는다.
    // 이미지는 답이 셋 다 '폴더 이름'이라 이 줄을 세우지 않는다.
    function columnRows(dataset, dict, locale) {
        const cols = dataset.columns;
        if (!cols) return '';
        const code = text => `<code class="text-indigo-600 dark:text-indigo-400 font-bold">${escapeHtml(text)}</code>`;

        const chip = (tone, label, detail, struck) => `
                <button type="button" aria-expanded="false" data-detail="${escapeHtml(detail)}"
                        class="col-chip inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full border text-sm font-semibold transition-colors ${tone}">
                    <span class="${struck ? 'line-through decoration-2' : ''}">${escapeHtml(label)}</span>
                    <i class="fa-solid fa-circle-info text-xs opacity-60"></i>
                </button>`;

        const targets = [];
        const multi = (cols.classification || []).length + (cols.regression || []).length > 1;
        for (const task of ['classification', 'regression']) {
            for (const col of cols[task] || []) {
                const detail = `${dict['task.' + task]} · ${code(columnName(col, locale))}`
                    + (cols.exclusive && multi ? `<br>${dict['col.exclusive']}` : '');
                targets.push(chip(TASK_TONES[task].badge + ' hover:brightness-95',
                    `${dict['task.' + task]} · ${columnShort(col, locale)}`, detail, false));
            }
        }
        if (dataset.tasks.includes('clustering')) {
            const detail = targets.length ? dict['col.cluster.compare'] : dict['col.cluster.none'];
            targets.push(chip(TASK_TONES.clustering.badge + ' hover:brightness-95',
                `${dict['task.clustering']} · ${dict['col.cluster']}`, detail, false));
        }

        const drops = (cols.drop || []).map(([col, reason]) => chip(
            'bg-slate-50 dark:bg-[#2c2c2e] text-slate-500 dark:text-[#a1a1a6] border-slate-200 dark:border-[#48484a] hover:border-slate-400',
            columnShort(col, locale), `${code(columnName(col, locale))}<br>${dict['reason.' + reason]}`, true));

        const row = (label, chips) => chips.length ? `
            <div class="flex items-start gap-2">
                <span class="shrink-0 w-12 pt-0.5 font-bold text-slate-800 dark:text-[#f5f5f7]">${label}</span>
                <div class="flex flex-wrap gap-1.5">${chips.join('')}</div>
            </div>` : '';

        return `
            <div class="col-rows text-base mb-3 space-y-2">
                ${row(dict['card.target'], targets)}
                ${row(dict['card.drop'], drops)}
                <div class="col-detail hidden ml-14 px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#2c2c2e] text-[15px] leading-relaxed text-slate-600 dark:text-[#d2d2d7]"></div>
            </div>`;
    }

    // 칩 펼치기. 격자는 다시 그려져도 상자는 그대로라 한 번만 묶는다.
    // 한 카드에 펼침 칸은 하나다 - 다른 칩을 누르면 내용이 바뀌고, 같은 칩을 다시 누르면 접힌다.
    function bindColumnChips() {
        document.getElementById('dataset-grid').addEventListener('click', event => {
            const btn = event.target.closest('.col-chip');
            if (!btn) return;
            const box = btn.closest('.col-rows');
            const panel = box.querySelector('.col-detail');
            const open = btn.getAttribute('aria-expanded') === 'true';
            box.querySelectorAll('.col-chip').forEach(b => {
                b.setAttribute('aria-expanded', 'false');
                b.classList.remove('ring-2', 'ring-indigo-300', 'dark:ring-indigo-500/50');
            });
            if (open) {
                panel.classList.add('hidden');
                return;
            }
            btn.setAttribute('aria-expanded', 'true');
            btn.classList.add('ring-2', 'ring-indigo-300', 'dark:ring-indigo-500/50');
            panel.innerHTML = btn.dataset.detail;
            panel.classList.remove('hidden');
        });
    }

    function badge(tone, label) {
        return `<span class="inline-flex items-center gap-1 xl:gap-1.5 px-2 xl:px-3 py-1 ${tone.badge} border text-[13px] xl:text-sm font-bold rounded-lg">
                    <i class="fa-solid ${tone.icon}"></i>${label}
                </span>`;
    }

    function createCard(dataset, dict, locale) {
        const formatTone = FORMAT_TONES[dataset.format];
        const badges = [badge(formatTone, dict['format.' + dataset.format])]
            .concat(dataset.tasks.map(task => badge(TASK_TONES[task], dict['task.' + task])))
            .concat(dataset.topics.map(topic => badge(TOPIC_TONE, dict['topic.' + topic])))
            .join('');

        // 숫자는 사전에 이름이 있는 것만 세운다 - stats에 아무 키나 들어와도 카드가 깨지지 않는다.
        // size는 자산을 실제로 포장한 뒤에야 알 수 있으므로, 없으면 그 칸을 세우지 않는다.
        const cell = (value, label) => `
                <div class="min-w-[3.5rem]">
                    <div class="text-xl font-bold text-slate-800 dark:text-[#f5f5f7]">${value}</div>
                    <div class="text-sm text-slate-400 dark:text-[#a1a1a6]">${label}</div>
                </div>`;

        const stats = Object.entries(dataset.stats)
            .filter(([key]) => dict['stat.' + key])
            .map(([key, value]) => cell(value.toLocaleString(locale), dict['stat.' + key]))
            .concat(dataset.size ? [cell(dataset.size, dict['stat.size'])] : [])
            .join('');

        const license = dataset.source.license
            ? `<span class="text-slate-500 dark:text-[#a1a1a6]">${dataset.source.license}</span>`
            : `<span class="text-amber-600 dark:text-amber-400 font-semibold">
                   <i class="fa-solid fa-triangle-exclamation mr-1"></i>${dict['card.license.unknown']}
               </span>`;

        const target = columnRows(dataset, dict, locale);

        return `
        <div class="bg-white dark:bg-[#1c1c1e] rounded-3xl border border-slate-200 dark:border-[#333336] shadow-lg p-5 md:p-8 flex flex-col">
            <!--
              **배지는 카드가 넓을 때만 제목 옆에 선다.** 아이콘 옆 칸은 카드 폭에서
              아이콘만큼 좁아서, 폰(375px)에서는 배지가 스물아홉 카드 중 스물둘에서
              두 줄 이상으로 꺾였다. 제목 아래 줄로 내려 카드 폭을 다 쓰면 열둘로,
              카드가 좁은 xl 아래에서 배지를 조금 줄이면 거의 사라진다. 카드가 564px인 xl부터는 옆에
              두어도 한 줄에 들어가고, 내리면 카드만 26px 길어지므로 옆에 둔다.
            -->
            <div class="grid grid-cols-[auto_1fr] items-center gap-x-3 md:gap-x-4 gap-y-3 mb-4 md:mb-5">
                <div class="w-12 h-12 md:w-14 md:h-14 xl:row-span-2 xl:self-start shrink-0 bg-slate-100 dark:bg-[#2c2c2e] text-slate-600 dark:text-[#d2d2d7] rounded-xl flex items-center justify-center text-2xl">
                    <i class="fa-solid ${dataset.icon}"></i>
                </div>
                <h3 class="min-w-0 text-xl font-bold text-slate-800 dark:text-[#f5f5f7] xl:self-end">${dataset.name[locale]}</h3>
                <div class="col-span-2 xl:col-span-1 xl:col-start-2 xl:self-start flex flex-wrap gap-1.5 xl:gap-2">${badges}</div>
            </div>

            <p class="text-slate-600 dark:text-[#d2d2d7] text-lg leading-relaxed mb-5 md:mb-6 flex-grow">${dataset.summary[locale]}</p>

            <!--
              **칸을 고정하지 않는다.** 네 칸짜리 격자로 두었더니 열한 카드 중 셋만
              그것을 채우고, 나머지는 마지막 칸이 비어 숫자가 왼쪽으로 몰렸다.
              같은 줄의 두 카드가 서로 다른 칸 수를 가지면 숫자 위치까지 어긋난다.
              흐르게 두면 칸이 둘이든 넷이든 왼쪽부터 같은 간격으로 채워진다.
            -->
            <div class="flex flex-wrap gap-x-6 md:gap-x-8 gap-y-3 md:gap-y-4 py-4 md:py-5 border-t border-b border-slate-200 dark:border-[#333336] mb-5 md:mb-6">
                ${stats}
            </div>

            ${target}

            <div class="text-base mb-6">
                <span class="font-bold text-slate-800 dark:text-[#f5f5f7] mr-2">${dict['card.source']}</span>
                <a href="${dataset.source.url}" target="_blank" rel="noopener noreferrer"
                   class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">
                    ${dataset.source.name}<i class="fa-solid fa-arrow-up-right-from-square ml-1.5 text-sm"></i>
                </a>
                <span class="mx-2 text-slate-300 dark:text-[#48484a]">·</span>${license}
            </div>

            <a href="${assetUrl(dataset, locale)}"
               class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-bold rounded-xl shadow-sm hover:shadow-md transition-all">
                <i class="fa-solid fa-download"></i>${dict['card.download']}
            </a>
        </div>`;
    }

    function renderFilters(dict) {
        // DATASETS에 실제로 존재하는 값만 칩이 된다.
        const usedFormats = FORMAT_ORDER.filter(f => DATASETS.some(d => d.format === f));
        const usedTasks = TASK_ORDER.filter(t => DATASETS.some(d => d.tasks.includes(t)));
        const usedTopics = TOPIC_ORDER.filter(t => DATASETS.some(d => d.topics.includes(t)));

        const chip = (value, label, active) => `
            <button type="button" data-value="${value === null ? '' : value}"
                    class="filter-chip ${active ? 'active' : ''} px-4 py-2 rounded-full border border-slate-300 dark:border-[#48484a] bg-white dark:bg-[#1c1c1e]
                           text-base font-semibold text-slate-600 dark:text-[#d2d2d7] hover:border-indigo-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">
                ${label}
            </button>`;

        document.getElementById('filter-format').innerHTML =
            chip(null, dict['filter.all'], activeFormat === null) +
            usedFormats.map(f => chip(f, dict['format.' + f], activeFormat === f)).join('');

        document.getElementById('filter-task').innerHTML =
            chip(null, dict['filter.all'], activeTask === null) +
            usedTasks.map(t => chip(t, dict['task.' + t], activeTask === t)).join('');

        document.getElementById('filter-topic').innerHTML =
            chip(null, dict['filter.all'], activeTopic === null) +
            usedTopics.map(t => chip(t, dict['topic.' + t], activeTopic === t)).join('');

        bindFilter('filter-format', value => { activeFormat = value; });
        bindFilter('filter-task', value => { activeTask = value; });
        bindFilter('filter-topic', value => { activeTopic = value; });
    }

    function bindFilter(containerId, setter) {
        document.getElementById(containerId).querySelectorAll('.filter-chip').forEach(btn => {
            btn.addEventListener('click', () => {
                setter(btn.dataset.value || null);
                const dict = I18N[currentLocale] || I18N[FALLBACK];
                renderFilters(dict);
                renderGrid(dict, currentLocale);
            });
        });
    }

    // 검색이 훑는 곳. **보고 있는 언어와 무관하게 모든 언어를 다 훑는다.**
    // 한국어로 보다가 iris로 찾는 사람이 있고, 영어로 보다가 붓꽃으로 찾는 사람이
    // 있다. 데이터셋 이름은 어느 쪽이든 같은 것을 가리키므로, 아는 이름으로
    // 부르면 나와야 한다. 출처와 타깃·빼기 열도 넣는다 - 'UCI'나 'Revenue'로 찾기도 한다.
    //
    // 열한 건짜리 배열이라 미리 색인을 만들지 않는다. 그럴 만큼 크지 않다.
    function haystack(dataset) {
        const all = byLocale => (byLocale ? Object.values(byLocale) : []);
        const labels = loc => [
            I18N[loc]['format.' + dataset.format],
            ...dataset.tasks.map(t => I18N[loc]['task.' + t]),
            ...dataset.topics.map(t => I18N[loc]['topic.' + t])
        ];

        return [
            ...all(dataset.name),
            ...all(dataset.summary),
            ...(dataset.columns ? Object.values(dataset.columns).flat(2).filter(v => typeof v === 'string') : []),
            dataset.source.name,
            ...SUPPORTED.flatMap(labels)
        ].join(' ').toLowerCase();
    }

    function renderGrid(dict, locale) {
        // 공백으로 끊어 낱말마다 만족해야 통과시킨다 - '붓꽃 분류'처럼 두 낱말로 좁힐 수 있다.
        const terms = query.toLowerCase().split(/\s+/).filter(Boolean);

        const matched = DATASETS.filter(d => {
            if (activeFormat !== null && d.format !== activeFormat) return false;
            if (activeTask !== null && !d.tasks.includes(activeTask)) return false;
            if (activeTopic !== null && !d.topics.includes(activeTopic)) return false;
            if (!terms.length) return true;
            const hay = haystack(d);
            return terms.every(t => hay.includes(t));
        });

        document.getElementById('dataset-grid').innerHTML =
            matched.map(d => createCard(d, dict, locale)).join('');

        // 영어는 하나일 때 dataset, 여럿일 때 datasets다. 한국어는 둘이 같은 문장이다.
        const countKey = matched.length === 1 && dict['list.count.one'] ? 'list.count.one' : 'list.count';
        document.getElementById('result-count').textContent =
            dict[countKey].replace('{n}', matched.length);

        document.getElementById('empty-state').classList.toggle('hidden', matched.length > 0);
    }

    function renderHow(dict) {
        document.getElementById('how-rows').innerHTML = dict['how.rows']
            .map(([term, body], i) => `
            <div class="flex flex-col sm:flex-row sm:items-baseline gap-2 sm:gap-8 py-5">
                <span class="shrink-0 sm:w-56 text-lg font-bold text-slate-800 dark:text-[#f5f5f7]">
                    <span class="inline-flex items-center justify-center w-7 h-7 mr-2 rounded-full bg-indigo-600 text-white text-base">${i + 1}</span>${term}
                </span>
                <p class="text-lg leading-relaxed text-slate-600 dark:text-[#d2d2d7]">${body}</p>
            </div>`)
            .join('');
    }

    function applyLocale(locale) {
        const dict = I18N[locale] || I18N[FALLBACK];
        currentLocale = SUPPORTED.includes(locale) ? locale : FALLBACK;

        loadLocaleFont(currentLocale);
        document.documentElement.lang = currentLocale;
        document.title = dict['meta.title'];
        document.getElementById('meta-description').setAttribute('content', dict['meta.desc']);

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const value = dict[el.dataset.i18n];
            if (typeof value === 'string') el.innerHTML = value;
        });

        document.querySelectorAll('[data-i18n-aria]').forEach(el => {
            el.setAttribute('aria-label', dict[el.dataset.i18nAria]);
        });

        // 검색 상자는 다시 그리지 않는다 - 문구만 갈아 끼워야 입력 중인 글자가 살아남는다.
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            el.setAttribute('placeholder', dict[el.dataset.i18nPlaceholder]);
        });

        // 규정 문서는 이 페이지 밖(앱 쪽)이라 자기 언어를 스스로 고른다.
        document.querySelectorAll('[data-lang-href]').forEach(el => {
            el.setAttribute('href', `${el.dataset.langHref}?lang=${currentLocale}`);
        });

        renderFilters(dict);
        renderGrid(dict, currentLocale);
        renderHow(dict);

        document.getElementById('lang-select').value = currentLocale;
    }

    function initThemeToggle() {
        const root = document.documentElement;
        const toggle = document.getElementById('theme-toggle');
        const syncLabel = () => {
            toggle.setAttribute('aria-label', root.dataset.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
        };
        syncLabel();
        toggle.addEventListener('click', () => {
            root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
            try {
                localStorage.setItem('theme', root.dataset.theme);
            } catch (e) {}
            syncLabel();
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        initThemeToggle();
        bindColumnChips();
        applyLocale(pickLocale());

        // 검색. 상자는 정적이라 한 번만 묶으면 되고, 언어를 바꿔도 입력이 살아 있다.
        const search = document.getElementById('search-input');
        let timer = null;
        search.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
                query = search.value.trim();
                renderGrid(I18N[currentLocale] || I18N[FALLBACK], currentLocale);
            }, SEARCH_DEBOUNCE_MS);
        });

        document.getElementById('lang-select').addEventListener('change', event => {
            const locale = event.target.value;
            try {
                localStorage.setItem(STORAGE_KEY, locale);
            } catch (e) {
                // 저장이 막혀도 이번 방문 동안은 바뀐 언어로 보여 준다.
            }
            applyLocale(locale);
        });

        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        setTimeout(() => {
            document.querySelectorAll('header.reveal, section.reveal:first-of-type')
                .forEach(el => el.classList.add('active'));
        }, 50);
    });
</script>

</body>
</html>
