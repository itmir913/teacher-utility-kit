<!DOCTYPE html>
<!--
  ml-playgrounds 예제 데이터셋 목록.

  카드를 HTML에 직접 쓰지 않는다. 아래 DATASETS 배열에 항목을 하나 더하면
  카드도, 필터 칩도, 개수도 전부 따라 움직인다.

  파일 자체는 이 저장소에 두지 않는다 - RELEASE_BASE가 가리키는
  GitHub 릴리스 자산에서 내려받는다.
-->
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" id="meta-description"
          content="Machine Learning Playgrounds에서 바로 사용할 수 있는 예제 데이터셋 모음입니다. 붓꽃·콩 품종·자전거 수요량 같은 표 데이터와 강아지/고양이·손글씨 숫자 같은 이미지 데이터를 분류·회귀·군집 실습용으로 제공합니다.">
    <meta name="keywords"
          content="머신러닝 데이터셋, 예제 데이터, 실습 데이터, 붓꽃, MNIST, 분류, 회귀, 군집, 인공지능 기초, machine learning datasets, sample data, education">
    <title>예제 데이터셋 | Machine Learning Playgrounds</title>

    <link rel="canonical" href="https://luminousky.com/teacher-utility-kit/ml-playgrounds/datasets/">
    <link rel="alternate" hreflang="ko" href="https://luminousky.com/teacher-utility-kit/ml-playgrounds/datasets/?lang=ko">
    <link rel="alternate" hreflang="en" href="https://luminousky.com/teacher-utility-kit/ml-playgrounds/datasets/?lang=en">
    <link rel="alternate" hreflang="x-default" href="https://luminousky.com/teacher-utility-kit/ml-playgrounds/datasets/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");

        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            letter-spacing: -0.01em;
        }

        /*
          Tailwind preflight가 code·kbd·samp·pre를 mono로 돌려놓는다. 이 페이지에는
          글꼴이 하나뿐이라 그 자리만 얼굴이 달라진다 - 열 이름과 확장자는 본문 속
          낱말이지 코드 블록이 아니다. body에서 물려받게 되돌린다.
        */
        body code, body kbd, body samp, body pre {
            font-family: inherit;
        }

        /* 한국어에서만 어절 단위로 끊는다. 영어에 걸면 줄바꿈이 망가진다. */
        html[lang="ko"] body {
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /*
          켜진 쪽은 hover에서도 켜진 채로 있어야 한다. **:hover까지 함께 적는다** -
          Tailwind의 hover:text-indigo-600과 명시도가 같으면, 나중에 주입되는
          Tailwind가 이겨서 남색 바탕에 남색 글자가 된다(글자가 사라진다).
        */
        .lang-btn.active,
        .lang-btn.active:hover {
            background: #4f46e5;
            color: #ffffff;
        }

        /* 필터 칩 - 켜진 것만 채운다. */
        .filter-chip.active,
        .filter-chip.active:hover {
            background: #4f46e5;
            border-color: #4f46e5;
            color: #ffffff;
        }

        .filter-chip.active:hover {
            background: #4338ca;
            border-color: #4338ca;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-700 selection:bg-indigo-600 selection:text-white min-h-screen flex flex-col text-base">

<!-- 언어 토글 -->
<div class="fixed top-4 right-4 z-50">
    <div role="group" data-i18n-aria="lang.aria"

                class="lang-btn px-4 py-2 text-base font-bold text-slate-600 hover:text-indigo-600 transition-colors">

        </button>
        <button type="button" data-lang="en"
                class="lang-btn px-4 py-2 text-base font-bold text-slate-600 hover:text-indigo-600 transition-colors">
            English
        </button>
    </div>
</div>

<!-- Header -->
<header class="relative py-20 flex flex-col items-center justify-center px-4 text-center reveal bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto relative z-10 w-full">
        <a href="../"
           class="inline-flex items-center gap-2 mb-6 px-4 py-1.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200 text-base font-bold tracking-tight hover:bg-indigo-100 transition-colors">
            <i class="fa-solid fa-arrow-left text-sm"></i>
            Machine Learning Playgrounds
        </a>
        <h1 class="text-4xl md:text-6xl font-bold tracking-tighter mb-6 text-slate-800 leading-tight"
            data-i18n="hero.title"></h1>
        <p class="text-xl md:text-2xl text-slate-500 font-medium max-w-3xl mx-auto tracking-tight mb-6 leading-relaxed"
           data-i18n="hero.tagline"></p>
        <p class="text-base text-slate-400 max-w-2xl mx-auto mb-10 leading-relaxed" data-i18n="hero.sub"></p>

        <div class="flex flex-wrap items-stretch justify-center gap-4 w-full max-w-2xl mx-auto">
            <a href="https://luminousky.com/ml-playgrounds/"
               class="flex-1 basis-64 px-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-bold rounded-xl shadow-sm hover:shadow-md transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-flask"></i>
                <span data-i18n="hero.cta.try"></span>
            </a>
            <!-- 소개 페이지의 '예제 데이터셋' 버튼과 같은 값이다. 두 페이지에서 짝이 같은 옷을 입는다. -->
            <a href="#datasets"
               class="flex-1 basis-64 px-8 py-4 bg-slate-800 hover:bg-slate-900 text-white border-2 border-slate-800 hover:border-slate-900 text-lg font-bold rounded-xl shadow-sm hover:shadow-md transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-list"></i>
                <span data-i18n="hero.cta.browse"></span>
            </a>
        </div>

        <p class="mt-6 text-base text-slate-400" data-i18n="hero.note"></p>
    </div>
</header>

<!--
  본문 폭은 소개 페이지와 같은 max-w-5xl이다. 더 넓히면 오른쪽 위에 고정된
  언어 토글과 본문이 겹친다. 두 페이지가 같은 폭이라 오가도 글줄이 흔들리지 않는다.
-->
<main class="flex-grow px-4 py-16">
    <div class="max-w-5xl mx-auto space-y-24">

        <!-- 목록 -->
        <section class="reveal" id="datasets">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-slate-800 tracking-tight mb-3" data-i18n="list.title"></h2>
                <p class="text-xl text-slate-500" data-i18n="list.lead"></p>
            </div>

            <!--
              찾기와 거르기. 두 갈래로 나눈다 - 무슨 파일인가, 무슨 모델을 붙일 수 있는가.
              칩도 카드도 DATASETS에서 나오므로 여기에는 빈 그릇만 둔다.
            -->
            <div class="bg-white rounded-3xl border border-slate-200 shadow-lg p-6 md:p-8 mb-10 space-y-5">
                <div class="flex flex-col sm:flex-row sm:items-center gap-3">
                    <span class="shrink-0 sm:w-40 text-base font-bold text-slate-800" data-i18n="filter.search"></span>
                    <div class="relative flex-1 w-full">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="search" id="search-input" autocomplete="off"
                               data-i18n-placeholder="filter.search.placeholder"
                               data-i18n-aria="filter.search"
                               class="w-full pl-11 pr-4 py-2.5 rounded-full border border-slate-300 bg-white
                                      text-base text-slate-700 placeholder:text-slate-400
                                      focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-colors">
                    </div>
                </div>
                <div class="flex flex-col sm:flex-row sm:items-center gap-3 pt-5 border-t border-slate-200">
                    <span class="shrink-0 sm:w-40 text-base font-bold text-slate-800" data-i18n="filter.format"></span>
                    <div class="flex flex-wrap gap-2" id="filter-format"></div>
                </div>
                <div class="flex flex-col sm:flex-row sm:items-center gap-3 pt-5 border-t border-slate-200">
                    <span class="shrink-0 sm:w-40 text-base font-bold text-slate-800" data-i18n="filter.task"></span>
                    <div class="flex flex-wrap gap-2" id="filter-task"></div>
                </div>
            </div>

            <p class="mb-6 text-base text-slate-400" id="result-count"></p>

            <!--
              두 열까지만 편다. 세 열로 가면 카드가 좁아져 요약과 통계가 잘게 끊기고,
              카드마다 담긴 것이 많아 오히려 읽기 어려워진다.
            -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="dataset-grid"></div>

            <p class="hidden text-center py-20 text-lg text-slate-400" id="empty-state" data-i18n="list.empty"></p>
        </section>

        <!-- 사용법 -->
        <section class="reveal">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-slate-800 tracking-tight mb-3" data-i18n="how.title"></h2>
                <p class="text-xl text-slate-500 leading-relaxed" data-i18n="how.lead"></p>
            </div>

            <div class="bg-white rounded-3xl border border-slate-200 shadow-lg p-8 md:p-10">
                <div class="flex flex-col divide-y divide-slate-200" id="how-rows"></div>
            </div>

            <p class="mt-6 text-center text-base text-slate-400" data-i18n="how.note"></p>
        </section>

        <!-- 출처와 라이선스 -->
        <section class="reveal">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-slate-800 tracking-tight mb-3" data-i18n="credit.title"></h2>
                <p class="text-xl text-slate-500 leading-relaxed" data-i18n="credit.lead"></p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white rounded-3xl border border-slate-200 shadow-lg p-8">
                    <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-2xl mb-6">
                        <i class="fa-solid fa-link"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-4" data-i18n="credit.origin.title"></h3>
                    <p class="text-slate-600 text-lg leading-relaxed" data-i18n="credit.origin.body"></p>
                </div>

                <div class="bg-white rounded-3xl border border-slate-200 shadow-lg p-8">
                    <div class="w-14 h-14 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-2xl mb-6">
                        <i class="fa-solid fa-language"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-4" data-i18n="credit.header.title"></h3>
                    <p class="text-slate-600 text-lg leading-relaxed" data-i18n="credit.header.body"></p>
                </div>
            </div>

            <p class="mt-6 text-center text-base text-slate-400 leading-relaxed" data-i18n="credit.note"></p>
        </section>

        <!-- 마무리 -->
        <section class="reveal text-center">
            <h2 class="text-3xl font-bold text-slate-800 tracking-tight mb-4" data-i18n="end.title"></h2>
            <p class="text-xl text-slate-500 mb-8 leading-relaxed" data-i18n="end.lead"></p>
            <a href="https://luminousky.com/ml-playgrounds/"
               class="inline-flex items-center justify-center gap-2 px-10 py-4 bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-bold rounded-xl shadow-sm hover:shadow-md transition-all">
                <i class="fa-solid fa-flask"></i>
                <span data-i18n="hero.cta.try"></span>
            </a>
        </section>

    </div>
</main>

<footer class="py-10 border-t border-slate-200 bg-white mt-auto">
    <div class="max-w-6xl mx-auto px-4 flex flex-col items-center">
        <nav class="flex flex-wrap items-center justify-center gap-x-6 gap-y-3 mb-5">
            <a href="https://luminousky.com/ml-playgrounds/"

        </p>

</footer>

<script>
    // =====================================================================
    // 1. 배포처
    //
    // 파일은 저장소가 아니라 ml-playgrounds의 고정 태그 릴리스에 붙어 있다.
    // **태그는 datasets 하나로 고정한다** - 태그를 올릴 때마다 이 페이지를 고쳐야
    // 한다면, 자료를 갱신할 때마다 코드를 건드리게 된다.
    //
    // 대신 어떤 자료의 내용이 크게 바뀌면 그 파일 하나만 이름을 올린다
    // (iris.ko.zip -> iris-2.ko.zip). 같은 이름을 덮어쓰면 이미 받아 간 쪽에
    // 낡은 것이 남을 수 있는데, 이름이 다르면 그 여지가 없다.
    // =====================================================================
    const RELEASE_BASE = 'https://github.com/itmir913/ml-playgrounds/releases/download/datasets/';

    // =====================================================================
    // 2. 데이터셋 목록
    //
    // 여기에 항목을 더하면 카드도 필터 칩도 개수도 전부 따라온다.
    //
    //   format  : 'csv' | 'images'
    //   tasks   : 'classification' | 'regression' | 'clustering' (복수 가능)
    //   stats   : 카드에 다는 숫자. 키는 STAT_LABELS에 있는 것만 쓴다.
    //   source  : { name, url, license } - license가 null이면 '확인 필요' 배지가 선다.
    //   assets  : 문자열이면 언어 공통 파일(이미지처럼 열 이름이 없는 것),
    //             { ko, en }이면 로케일에 따라 갈린다(한국어 병기 CSV).
    //             **로케일은 확장자 앞에 점으로 붙인다** - iris.ko.zip / iris.en.zip.
    //             이름 안의 붙임표(dry-bean)와 섞이지 않아, 어디까지가 이름이고
    //             어디부터가 언어인지 파일명만 보고 갈린다.
    // =====================================================================
    const DATASETS = [
        {
            id: 'iris',
            icon: 'fa-seedling',
            format: 'csv',
            tasks: ['classification', 'clustering'],
            name: { ko: '붓꽃 데이터', en: 'Iris' },
            summary: {
                ko: '꽃받침과 꽃잎의 길이·너비로 붓꽃 세 품종을 구별합니다. 열이 넷뿐이라 결정 경계를 눈으로 따라갈 수 있어, 분류를 처음 다룰 때 쓰기 좋습니다.',
                en: 'Tell three iris species apart from sepal and petal measurements. With only four features you can follow the decision boundary by eye, which makes it a good first classification set.'
            },
            stats: { rows: 150, features: 4, classes: 3 },
            size: '30 KB',
            target: { ko: '붓꽃 품종 (class)', en: 'class' },
            source: {
                name: 'UCI Machine Learning Repository',
                url: 'https://archive.ics.uci.edu/dataset/53/iris',
                license: 'CC BY 4.0'
            },
            assets: { ko: 'iris.ko.zip', en: 'iris.en.zip' }
        },
        {
            id: 'dry-bean',
            icon: 'fa-wheat-awn',
            format: 'csv',
            tasks: ['classification', 'clustering'],
            name: { ko: '콩 품종', en: 'Dry Bean' },
            summary: {
                ko: '콩 사진에서 뽑아낸 면적·둘레·이심률 등 열여섯 가지 형태 특징으로 일곱 품종을 구별합니다. 행이 만 삼천 개를 넘어 학습·테스트 분할의 의미가 드러납니다.',
                en: 'Sixteen shape features measured from bean photographs, used to separate seven varieties. With over thirteen thousand rows, the train/test split starts to mean something.'
            },
            stats: { rows: 13611, features: 16, classes: 7 },
            size: '1.0 MB',
            target: { ko: '품종 (Class)', en: 'Class' },
            source: {
                name: 'UCI Machine Learning Repository',
                url: 'https://archive.ics.uci.edu/dataset/602/dry+bean+dataset',
                license: 'CC BY 4.0'
            },
            assets: { ko: 'dry-bean.ko.zip', en: 'dry-bean.en.zip' }
        },
        {
            id: 'car-evaluation',
            icon: 'fa-car',
            format: 'csv',
            tasks: ['classification'],
            name: { ko: '자동차 평가', en: 'Car Evaluation' },
            summary: {
                ko: '구매가·유지비·문 수·승차 인원·안전도로 수용 등급 네 단계를 판정합니다. 열이 전부 범주형이라 범주 인코딩을 왜 하는지 설명하기에 적합합니다.',
                en: 'Judge a car into one of four acceptability grades from price, upkeep, doors, capacity, and safety. Every column is categorical, which makes it a natural place to explain encoding.'
            },
            stats: { rows: 1728, features: 6, classes: 4 },
            size: '5 KB',
            target: { ko: '수용 등급 (class)', en: 'class' },
            source: {
                name: 'UCI Machine Learning Repository',
                url: 'https://archive.ics.uci.edu/dataset/19/car+evaluation',
                license: 'CC BY 4.0'
            },
            assets: { ko: 'car-evaluation.ko.zip', en: 'car-evaluation.en.zip' }
        },
        {
            id: 'online-shoppers',
            icon: 'fa-cart-shopping',
            format: 'csv',
            tasks: ['classification'],
            name: { ko: '온라인 쇼핑 구매 예측', en: 'Online Shoppers Purchasing Intention' },
            summary: {
                ko: '방문자의 페이지 체류 시간과 이탈률 등으로 구매까지 이어졌는지를 예측합니다. 구매한 방문이 전체의 15%뿐이라 정확도만 보면 안 되는 이유를 보여 줍니다.',
                en: 'Predict whether a session ended in a purchase from page durations, bounce rates, and visit context. Only 15% of sessions convert — a clean way to show why accuracy alone misleads.'
            },
            stats: { rows: 12330, features: 17, classes: 2 },
            size: '234 KB',
            target: { ko: '구매 여부 (Revenue)', en: 'Revenue' },
            source: {
                name: 'UCI Machine Learning Repository',
                url: 'https://archive.ics.uci.edu/dataset/468/online+shoppers+purchasing+intention+dataset',
                license: 'CC BY 4.0'
            },
            assets: { ko: 'online-shoppers.ko.zip', en: 'online-shoppers.en.zip' }
        },
        {
            id: 'wholesale-customers',
            icon: 'fa-store',
            format: 'csv',
            tasks: ['clustering'],

    const SUPPORTED = ['ko', 'en'];
    const FALLBACK = 'ko';
    const STORAGE_KEY = 'mlp-landing-lang';

    // 지금 켜져 있는 필터. null이면 그 갈래는 전부 통과시킨다.
    let currentLocale = FALLBACK;
    let activeFormat = null;
    let activeTask = null;
    let query = '';

    // 검색어를 한 글자마다 처리하지 않는다. 마지막 입력에서 이만큼 쉬면 그때 그린다.
    const SEARCH_DEBOUNCE_MS = 100;

    function pickLocale() {
        const fromQuery = new URLSearchParams(location.search).get('lang');
        if (SUPPORTED.includes(fromQuery)) return fromQuery;

        let stored = null;
        try {
            stored = localStorage.getItem(STORAGE_KEY);
        } catch (e) {
            // 사생활 보호 모드 등에서 접근이 막히면 그냥 브라우저 언어를 본다.
        }
        if (SUPPORTED.includes(stored)) return stored;

        const preferred = navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || FALLBACK];
        for (const tag of preferred) {
            const base = String(tag).toLowerCase().split('-')[0];
            if (SUPPORTED.includes(base)) return base;
        }
        return FALLBACK;
    }

    // 한국어 병기본과 원본이 갈리는 자리. 문자열 하나면 언어 공통 파일이다.
    function assetUrl(dataset, locale) {
        const assets = dataset.assets;
        const file = typeof assets === 'string' ? assets : (assets[locale] || assets[FALLBACK]);
        return RELEASE_BASE + file;
    }

    function badge(tone, label) {
        return `<span class="inline-flex items-center gap-1.5 px-3 py-1 ${tone.badge} border text-sm font-bold rounded-lg">
                    <i class="fa-solid ${tone.icon}"></i>${label}
                </span>`;
    }

    function createCard(dataset, dict, locale) {
        const formatTone = FORMAT_TONES[dataset.format];
        const badges = [badge(formatTone, dict['format.' + dataset.format])]
            .concat(dataset.tasks.map(task => badge(TASK_TONES[task], dict['task.' + task])))
            .join('');

        // 숫자는 사전에 이름이 있는 것만 세운다 - stats에 아무 키나 들어와도 카드가 깨지지 않는다.
        // size는 자산을 실제로 포장한 뒤에야 알 수 있으므로, 없으면 그 칸을 세우지 않는다.
        const cell = (value, label) => `
                <div class="min-w-[3.5rem]">
                    <div class="text-xl font-bold text-slate-800">${value}</div>
                    <div class="text-sm text-slate-400">${label}</div>
                </div>`;

        const stats = Object.entries(dataset.stats)
            .filter(([key]) => dict['stat.' + key])
            .map(([key, value]) => cell(value.toLocaleString(locale), dict['stat.' + key]))
            .concat(dataset.size ? [cell(dataset.size, dict['stat.size'])] : [])
            .join('');

        const license = dataset.source.license
            ? `<span class="text-slate-500">${dataset.source.license}</span>`
            : `<span class="text-amber-600 font-semibold">
                   <i class="fa-solid fa-triangle-exclamation mr-1"></i>${dict['card.license.unknown']}
               </span>`;

        // 카드마다 같은 말을 반복하게 된다. 그건 사용법 절이 한 번 말한다.

        const target = dataset.target ? `
            <div class="text-base mb-3">
                <span class="font-bold text-slate-800 mr-2">${dict['card.target']}</span>
                <code class="text-indigo-600 font-bold">${dataset.target[locale]}</code>
            </div>` : '';

        return `
        <div class="bg-white rounded-3xl border border-slate-200 shadow-lg p-8 flex flex-col">
            <div class="flex items-start gap-4 mb-5">
                <div class="w-14 h-14 shrink-0 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center text-2xl">
                    <i class="fa-solid ${dataset.icon}"></i>
                </div>
                <div class="min-w-0">
                    <h3 class="text-xl font-bold text-slate-800 mb-2">${dataset.name[locale]}</h3>
                    <div class="flex flex-wrap gap-2">${badges}</div>
                </div>
            </div>

            <p class="text-slate-600 text-lg leading-relaxed mb-6 flex-grow">${dataset.summary[locale]}</p>

            <!--
              **칸을 고정하지 않는다.** 네 칸짜리 격자로 두었더니 열한 카드 중 셋만
              그것을 채우고, 나머지는 마지막 칸이 비어 숫자가 왼쪽으로 몰렸다.
              같은 줄의 두 카드가 서로 다른 칸 수를 가지면 숫자 위치까지 어긋난다.
              흐르게 두면 칸이 둘이든 넷이든 왼쪽부터 같은 간격으로 채워진다.
            -->
            <div class="flex flex-wrap gap-x-8 gap-y-4 py-5 border-t border-b border-slate-200 mb-6">
                ${stats}
            </div>

            ${target}

            <div class="text-base mb-6">
                <span class="font-bold text-slate-800 mr-2">${dict['card.source']}</span>
                <a href="${dataset.source.url}" target="_blank" rel="noopener noreferrer"
                   class="text-indigo-600 font-semibold hover:underline">
                    ${dataset.source.name}<i class="fa-solid fa-arrow-up-right-from-square ml-1.5 text-sm"></i>
                </a>
                <span class="mx-2 text-slate-300">·</span>${license}
            </div>

            <a href="${assetUrl(dataset, locale)}"
               class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-bold rounded-xl shadow-sm hover:shadow-md transition-all">
                <i class="fa-solid fa-download"></i>${dict['card.download']}
            </a>
        </div>`;
    }

    function renderFilters(dict) {
        // DATASETS에 실제로 존재하는 값만 칩이 된다.
        const usedFormats = FORMAT_ORDER.filter(f => DATASETS.some(d => d.format === f));
        const usedTasks = TASK_ORDER.filter(t => DATASETS.some(d => d.tasks.includes(t)));

        const chip = (value, label, active) => `
            <button type="button" data-value="${value === null ? '' : value}"
                    class="filter-chip ${active ? 'active' : ''} px-4 py-2 rounded-full border border-slate-300 bg-white
                           text-base font-semibold text-slate-600 hover:border-indigo-400 hover:text-indigo-600 transition-colors">
                ${label}
            </button>`;

        document.getElementById('filter-format').innerHTML =
            chip(null, dict['filter.all'], activeFormat === null) +
            usedFormats.map(f => chip(f, dict['format.' + f], activeFormat === f)).join('');

        document.getElementById('filter-task').innerHTML =
            chip(null, dict['filter.all'], activeTask === null) +
            usedTasks.map(t => chip(t, dict['task.' + t], activeTask === t)).join('');

        bindFilter('filter-format', value => { activeFormat = value; });
        bindFilter('filter-task', value => { activeTask = value; });
    }

    function bindFilter(containerId, setter) {
        document.getElementById(containerId).querySelectorAll('.filter-chip').forEach(btn => {
            btn.addEventListener('click', () => {
                setter(btn.dataset.value || null);
                const dict = I18N[currentLocale] || I18N[FALLBACK];
                renderFilters(dict);
                renderGrid(dict, currentLocale);
            });
        });
    }

    // 검색이 훑는 곳. **보고 있는 언어와 무관하게 두 언어를 다 훑는다.**
    // 한국어로 보다가 iris로 찾는 사람이 있고, 영어로 보다가 붓꽃으로 찾는 사람이
    // 있다. 데이터셋 이름은 어느 쪽이든 같은 것을 가리키므로, 아는 이름으로
    // 부르면 나와야 한다. 출처와 목표 열도 넣는다 - 'UCI'나 'Revenue'로 찾기도 한다.
    //
    // 열한 건짜리 배열이라 미리 색인을 만들지 않는다. 그럴 만큼 크지 않다.
    function haystack(dataset) {
        const both = pair => (pair ? [pair.ko, pair.en] : []);
        const labels = loc => [
            I18N[loc]['format.' + dataset.format],
            ...dataset.tasks.map(t => I18N[loc]['task.' + t])
        ];

        return [
            ...both(dataset.name),
            ...both(dataset.summary),
            ...both(dataset.target),
            dataset.source.name,
            ...labels('ko'),
            ...labels('en')
        ].join(' ').toLowerCase();
    }

    function renderGrid(dict, locale) {
        // 공백으로 끊어 낱말마다 만족해야 통과시킨다 - '붓꽃 분류'처럼 두 낱말로 좁힐 수 있다.
        const terms = query.toLowerCase().split(/\s+/).filter(Boolean);

        const matched = DATASETS.filter(d => {
            if (activeFormat !== null && d.format !== activeFormat) return false;
            if (activeTask !== null && !d.tasks.includes(activeTask)) return false;
            if (!terms.length) return true;
            const hay = haystack(d);
            return terms.every(t => hay.includes(t));
        });

        document.getElementById('dataset-grid').innerHTML =
            matched.map(d => createCard(d, dict, locale)).join('');

        // 영어는 하나일 때 dataset, 여럿일 때 datasets다. 한국어는 둘이 같은 문장이다.
        const countKey = matched.length === 1 && dict['list.count.one'] ? 'list.count.one' : 'list.count';
        document.getElementById('result-count').textContent =
            dict[countKey].replace('{n}', matched.length);

        document.getElementById('empty-state').classList.toggle('hidden', matched.length > 0);
    }

    function renderHow(dict) {
        document.getElementById('how-rows').innerHTML = dict['how.rows']
            .map(([term, body], i) => `
            <div class="flex flex-col sm:flex-row sm:items-baseline gap-2 sm:gap-8 py-5">
                <span class="shrink-0 sm:w-56 text-lg font-bold text-slate-800">
                    <span class="inline-flex items-center justify-center w-7 h-7 mr-2 rounded-full bg-indigo-600 text-white text-base">${i + 1}</span>${term}
                </span>
                <p class="text-lg leading-relaxed text-slate-600">${body}</p>
            </div>`)
            .join('');
    }

    function applyLocale(locale) {
        const dict = I18N[locale] || I18N[FALLBACK];
        currentLocale = SUPPORTED.includes(locale) ? locale : FALLBACK;

        document.documentElement.lang = currentLocale;
        document.title = dict['meta.title'];
        document.getElementById('meta-description').setAttribute('content', dict['meta.desc']);

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const value = dict[el.dataset.i18n];
            if (typeof value === 'string') el.innerHTML = value;
        });

        document.querySelectorAll('[data-i18n-aria]').forEach(el => {
            el.setAttribute('aria-label', dict[el.dataset.i18nAria]);
        });

        // 검색 상자는 다시 그리지 않는다 - 문구만 갈아 끼워야 입력 중인 글자가 살아남는다.
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            el.setAttribute('placeholder', dict[el.dataset.i18nPlaceholder]);
        });

        // 규정 문서는 이 페이지 밖(앱 쪽)이라 자기 언어를 스스로 고른다.
        document.querySelectorAll('[data-lang-href]').forEach(el => {
            el.setAttribute('href', `${el.dataset.langHref}?lang=${currentLocale}`);
        });

        renderFilters(dict);
        renderGrid(dict, currentLocale);
        renderHow(dict);

        document.querySelectorAll('.lang-btn').forEach(btn => {
            const on = btn.dataset.lang === currentLocale;
            btn.classList.toggle('active', on);
            btn.setAttribute('aria-pressed', String(on));
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        applyLocale(pickLocale());

        // 검색. 상자는 정적이라 한 번만 묶으면 되고, 언어를 바꿔도 입력이 살아 있다.
        const search = document.getElementById('search-input');
        let timer = null;
        search.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
                query = search.value.trim();
                renderGrid(I18N[currentLocale] || I18N[FALLBACK], currentLocale);
            }, SEARCH_DEBOUNCE_MS);
        });

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const locale = btn.dataset.lang;
                try {
                    localStorage.setItem(STORAGE_KEY, locale);
                } catch (e) {
                    // 저장이 막혀도 이번 방문 동안은 바뀐 언어로 보여 준다.
                }
                applyLocale(locale);
            });
        });

        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        setTimeout(() => {
            document.querySelectorAll('header.reveal, section.reveal:first-of-type')
                .forEach(el => el.classList.add('active'));
        }, 50);
    });
</script>

</body>
</html>
